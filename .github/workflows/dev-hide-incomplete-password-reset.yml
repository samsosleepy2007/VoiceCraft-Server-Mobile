name: Dev Hide Incomplete Password Reset

on:
  push:
    branches: [account-phase1]
    paths:
      - ".github/workflows/dev-hide-incomplete-password-reset.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account-phase1
          fetch-depth: 0
      - name: Hide password reset until deep-link recovery is complete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('VoiceCraft.Server.Android/AccountActivity.cs')
          s = p.read_text(encoding='utf-8')
          block = '''        if (!_registerMode)\n        {\n            var reset = Button("FORGOT PASSWORD", false);\n            reset.Click += async (_, _) => await ResetPasswordAsync();\n            card.AddView(reset, ButtonParams());\n        }\n\n'''
          if block in s:
              s = s.replace(block, '', 1)
          elif 'FORGOT PASSWORD' in s:
              raise SystemExit('Unexpected Forgot Password UI shape')
          p.write_text(s, encoding='utf-8')
          PY
          ! grep -q 'FORGOT PASSWORD' VoiceCraft.Server.Android/AccountActivity.cs
          grep -q 'SendPasswordResetAsync' VoiceCraft.Server.Android/SupabaseAuthClient.cs
      - name: Commit product source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VoiceCraft.Server.Android/AccountActivity.cs
          git diff --cached --quiet && exit 0
          git commit -m "fix(account): hide reset flow until mobile deep linking is ready"
          git push origin HEAD:account-phase1
