name: Fix Backup Relay Activity Compile Namespace

on:
  push:
    branches: [multi-relay-auto-failover]
    paths:
      - ".github/workflows/dev-fix-backup-activity.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-relay-auto-failover
          fetch-depth: 0

      - name: Fix namespace qualification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('VoiceCraft.Server.Android/BackupRelayActivity.cs')
          text = p.read_text(encoding='utf-8')
          old = 'view.SetTypeface(Android.Graphics.Typeface.Default, Android.Graphics.TypefaceStyle.Bold);'
          new = 'view.SetTypeface(global::Android.Graphics.Typeface.Default, global::Android.Graphics.TypefaceStyle.Bold);'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Typeface occurrence, found {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Keep workflow unchanged in generated commit
        run: git checkout HEAD -- .github/workflows

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VoiceCraft.Server.Android/BackupRelayActivity.cs
          git commit -m "fix(android): qualify Android Typeface namespace"
          git push origin HEAD:multi-relay-auto-failover
