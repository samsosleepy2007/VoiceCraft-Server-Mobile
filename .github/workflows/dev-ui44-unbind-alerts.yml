name: Dev UI4.4 Unbind And Relay Alerts

on:
  push:
    branches: [multi-relay-auto-failover]
    paths:
      - ".github/workflows/dev-ui44-unbind-alerts.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-relay-auto-failover
          fetch-depth: 0

      - name: Apply UI4.4 and Endstone 0.2.6 source patch
        run: python tools/dev_apply_ui44_wrapper.py

      - name: Validate patched source syntax and safety guards
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q VoiceCraft.Endstone/src VoiceCraft.Endstone/tests
          node --check VoiceCraft.Bridge.Relay/index.js
          grep -q 'version = "0.2.6"' VoiceCraft.Endstone/pyproject.toml
          grep -q 'Disconnect / Unbind Microphone' VoiceCraft.Endstone/src/endstone_voicecraft/menu.py
          grep -q '§6§l\[VoiceCraft Server\]§r' VoiceCraft.Endstone/src/endstone_voicecraft/menu.py
          grep -q 'ไม่พบเซิร์ฟเวอร์สำรอง' VoiceCraft.Endstone/src/endstone_voicecraft/menu.py
          grep -q 'case "unbind"' VoiceCraft.Bridge.Relay/index.js
          grep -q 'case "unbind_result"' VoiceCraft.Bridge.Relay/index.js
          grep -q 'Destructive control messages are intentionally never cached/replayed' VoiceCraft.Bridge.Relay/index.js
          grep -q 'BridgeUnbindRequest' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'VoiceCraft.DisconnectReason.Kicked' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'ApplicationVersion>10<' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj

      - name: Commit patched product source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VoiceCraft.Endstone VoiceCraft.Bridge.Relay VoiceCraft.Server.Android
          git commit -m "feat: add real vc unbind and in-game relay alerts"
          git push origin HEAD:multi-relay-auto-failover

      # Rerun after preserving generated Python escape sequences.
