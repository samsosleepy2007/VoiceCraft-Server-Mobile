          text = text.replace('          assert VoiceCraftEndstone.api_version == "0.11"\n          assert VoiceCraftEndstone.version == "0.2.3"', '          assert VoiceCraftEndstone.api_version == "0.11"\n          assert VoiceCraftEndstone is AutoRebindVoiceCraftEndstone\n          assert VoiceCraftEndstone.version == "0.2.3"', 1)
          write(path, text)

          path = ".github/workflows/build-android.yml"
          text = read(path).replace("branches: [main, endstone-phase2, modern-azure-ui]", "branches: [main, endstone-phase2, modern-azure-ui, android-ui4.2-endstone-0.2.3]")
          text = text.replace("name: VoiceCraft-Server-Android-arm64-Phase2", "name: VoiceCraft-Server-Android-arm64-UI4.2")
          write(path, text)

          path = ".github/workflows/check-relay.yml"
          text = read(path).replace("branches: [main, endstone-phase2]", "branches: [main, endstone-phase2, android-ui4.2-endstone-0.2.3]")
          old = '''          await received;
          endstone.close();
          android.close();
          console.log("Relay websocket forwarding OK");'''
          new = '''          await received;

          const disconnectReceived = new Promise((resolve, reject) => {
            const timer = setTimeout(() => reject(new Error("voice_client_disconnected was not forwarded")), 5000);
            endstone.on("message", (raw) => {
              const msg = JSON.parse(raw.toString());
              if (msg.type === "voice_client_disconnected" && msg.xuid === "123") {
                clearTimeout(timer);
                resolve(msg);
              }
            });
          });
          android.send(JSON.stringify({
            type: "voice_client_disconnected",
            serverId,
            name: "CI",
            xuid: "123",
            uuid: "ci",
            entityId: 7
          }));
          await disconnectReceived;

          endstone.close();
          android.close();
          console.log("Relay websocket forwarding + disconnect event OK");'''
          if old not in text:
              raise SystemExit("check-relay insertion anchor missing")
          text = text.replace(old, new, 1)
          write(path, text)

          # Documentation/version bookkeeping.
          path = "README.md"
          text = read(path)
          text = text.replace("Current Android app version: **`1.7.1-android-phase2-ui4.1`** (version code `7`).", "Current Android app version: **`1.7.1-android-phase2-ui4.2`** (version code `8`).")
          text = text.replace("Current Endstone plugin version: **`0.2.1`**, verified as the companion plugin for the UI4.1 release bundle.", "Current Endstone plugin version: **`0.2.3`**, paired with Android UI4.2 and Render Relay protocol 1.")
          text = text.replace("- UI4.1 native click-dispatch hotfix so animation-only touch handlers no longer swallow button actions", "- UI4.1 native click-dispatch hotfix so animation-only touch handlers no longer swallow button actions\n- UI4.2 live Minecraft player / binding dashboard with Request Snapshot\n- Automatic 5-second rebind prompt when an already-bound VoiceCraft client disconnects")
          write(path, text)

          path = "VoiceCraft.Endstone/README.md"
          text = read(path)
          if "## Endstone 0.2.3" not in text:
              text += '''\n\n## Endstone 0.2.3\n\n- Keeps the automatic join-time bind form from 0.2.2.\n- Receives `voice_client_disconnected` from Android when a bound VoiceCraft entity disappears while the Minecraft player remains online.\n- Sends a red in-game warning immediately, waits 5 seconds, then opens the same Binding Key form again.\n- Duplicate disconnect notifications are suppressed while the rebind timer is active.\n- If the player leaves or binds manually before the timer expires, the form is not reopened unnecessarily.\n- Render Relay protocol remains `1`; the new message is additive.\n'''
          write(path, text)

          path = "CHANGELOG.md"
          text = read(path)
          anchor = "The project keeps VoiceCraft upstream pinned to **v1.7.1** while evolving the Android host, Endstone integration, Render relay and user interface around it.\n"
          section = '''\n## 2026-09-08 — Android UI4.2 + Endstone 0.2.3\n\nAndroid version: `1.7.1-android-phase2-ui4.2` (version code `8`)  \nEndstone plugin: `0.2.3`  \nRelay protocol: `1`\n\n### Added\n\n- Live Android dashboard for Minecraft players, bound/unbound status, entity ID, dimension and position.\n- Android `Request Snapshot` action for a fresh Endstone state snapshot.\n- Android detects destruction of an already-bound VoiceCraft client entity while its Minecraft player remains online.\n- New additive protocol-1 `voice_client_disconnected` control message forwarded through Render.\n- Endstone shows a red disconnect warning immediately and reopens the Binding Key form after 5 seconds.\n- Duplicate disconnect events are suppressed and manual binding/player quit cancels unnecessary rebind UI.\n\n### Preserved\n\n- VoiceCraft v1.7.1 wire protocol and direct LiteNetLib UDP voice path.\n- Render remains control plane only.\n- Auto Bind UI on initial join from Endstone 0.2.2.\n- Binding Keys and Bridge Secret remain hidden from logs/dashboard.\n\n---\n'''
          if "## 2026-09-08 — Android UI4.2 + Endstone 0.2.3" not in text:
              text = text.replace(anchor, anchor + section, 1)
          write(path, text)

          print("UI4.2 / Endstone 0.2.3 source patch applied")
          PY

      - name: Verify patch markers
        run: |
          grep -q 'ApplicationVersion>8<' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          grep -q 'voice_client_disconnected' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'BridgeDashboard' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'version = "0.2.3"' VoiceCraft.Endstone/pyproject.toml
          grep -q '_RECONNECT_FORM_DELAY_TICKS = 100' VoiceCraft.Endstone/src/endstone_voicecraft/auto_rebind.py
          grep -q 'voice_client_disconnected' VoiceCraft.Bridge.Relay/index.js

