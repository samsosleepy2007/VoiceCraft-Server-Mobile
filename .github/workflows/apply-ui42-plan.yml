name: Apply UI4.2 Plan

on:
  push:
    branches: [android-ui4.2-endstone-0.2.3]
    paths:
      - ".github/workflows/apply-ui42-plan.yml"

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-ui4.2-endstone-0.2.3

      - name: Fix C# dashboard strings
        run: python .github/scripts/fix_ui42_strings.py

      - name: Verify fixed source
        run: |
          grep -Fq 'return $"{player.Name}\n{binding}\n{player.Dimension}' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -Fq 'string.Join("\n\n", rows)' VoiceCraft.Server.Android/ModernMainActivity.cs

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VoiceCraft.Server.Android/ModernMainActivity.cs
          git commit -m "Fix UI4.2 dashboard multiline strings"
          git push origin HEAD:android-ui4.2-endstone-0.2.3
