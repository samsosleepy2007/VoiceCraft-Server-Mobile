name: Apply UI4.2 Plan

on:
  push:
    branches: [android-ui4.2-endstone-0.2.3]
    paths:
      - ".github/workflows/apply-ui42-plan.yml"

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-ui4.2-endstone-0.2.3

      - name: Apply source changes
        run: python .github/scripts/apply_ui42_source_only.py

      - name: Verify patch markers
        run: |
          grep -q 'ApplicationVersion>8<' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          grep -q 'voice_client_disconnected' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'BridgeDashboard' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'version = "0.2.3"' VoiceCraft.Endstone/pyproject.toml
          grep -q '_RECONNECT_FORM_DELAY_TICKS = 100' VoiceCraft.Endstone/src/endstone_voicecraft/auto_rebind.py
          grep -q 'voice_client_disconnected' VoiceCraft.Bridge.Relay/index.js

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VoiceCraft.Server.Android VoiceCraft.Bridge.Relay VoiceCraft.Endstone README.md CHANGELOG.md
          git commit -m "Add Android UI4.2 dashboard and automatic VoiceCraft rebind"
          git push origin HEAD:android-ui4.2-endstone-0.2.3
