name: Apply UI4.2 Plan

on:
  push:
    branches: [android-ui4.2-endstone-0.2.3]
    paths:
      - ".github/workflows/apply-ui42-plan.yml"

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-ui4.2-endstone-0.2.3

      - name: Apply source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace(path, old, new, count=1):
              text = read(path)
              if new in text:
                  return
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"Patch anchor missing in {path}: expected >= {count}, found {actual}\n{old[:180]}")
              text = text.replace(old, new, count)
              write(path, text)

          # Android version bump: UI4.2 / version code 8.
          path = "VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj"
          text = read(path)
          text = text.replace("<ApplicationVersion>7</ApplicationVersion>", "<ApplicationVersion>8</ApplicationVersion>")
          text = text.replace("<ApplicationDisplayVersion>1.7.1-android-phase2-ui4.1</ApplicationDisplayVersion>", "<ApplicationDisplayVersion>1.7.1-android-phase2-ui4.2</ApplicationDisplayVersion>")
          write(path, text)

          # Android bridge: publish a safe immutable dashboard snapshot and report a bound voice-client disconnect.
          path = "VoiceCraft.Server.Android/EndstoneBridgeController.cs"
