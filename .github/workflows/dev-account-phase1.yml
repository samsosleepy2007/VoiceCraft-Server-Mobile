name: Dev Account Phase1 Patch

on:
  push:
    branches: [account-phase1]
    paths:
      - "tools/dev_account_phase1.py"
      - ".github/workflows/dev-account-phase1.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account-phase1
          fetch-depth: 0

      - name: Apply account launcher/version patch
        run: python tools/dev_account_phase1.py

      - name: Validate markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MainLauncher = false' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'AccountActivity.LaunchManage(this)' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q '<ApplicationVersion>11</ApplicationVersion>' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          grep -q '1.7.1-android-phase2-ui4.5' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          grep -q 'MainLauncher = true' VoiceCraft.Server.Android/AccountActivity.cs

      - name: Commit product source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VoiceCraft.Server.Android/ModernMainActivity.cs VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          git diff --cached --quiet && exit 0
          git commit -m "feat(account): gate dashboard behind Supabase login"
          git push origin HEAD:account-phase1
