name: Dev Fix Account UI Bindings

on:
  push:
    branches: [account-phase1]
    paths:
      - ".github/workflows/dev-fix-account-ui-bindings.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: account-phase1
          fetch-depth: 0
      - name: Patch Android UI bindings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('VoiceCraft.Server.Android/AccountActivity.cs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('            Orientation = Orientation.Vertical,\n            Gravity = GravityFlags.Center,\n            Background = new ColorDrawable(Color.Rgb(10, 16, 31))', '            Orientation = Orientation.Vertical,\n            Background = new ColorDrawable(Color.Rgb(10, 16, 31))')
          s = s.replace('        root.SetPadding(Dp(20), Dp(28), Dp(20), Dp(28));', '        root.SetGravity(GravityFlags.Center);\n        root.SetPadding(Dp(20), Dp(28), Dp(20), Dp(28));')
          s = s.replace('            Hint = hint,\n            SingleLine = true,\n            Background = Rounded(Color.Rgb(31, 43, 70), 14)', '            Hint = hint,\n            Background = Rounded(Color.Rgb(31, 43, 70), 14)')
          s = s.replace('        input.SetTextColor(Color.White);', '        input.SetSingleLine(true);\n        input.SetTextColor(Color.White);')
          s = s.replace('            Text = text,\n            AllCaps = false,\n            Background = Rounded(primary ? Color.Rgb(73, 116, 255) : Color.Rgb(38, 51, 82), 14)', '            Text = text,\n            Background = Rounded(primary ? Color.Rgb(73, 116, 255) : Color.Rgb(38, 51, 82), 14)')
          s = s.replace('        button.SetTextColor(Color.White);', '        button.SetAllCaps(false);\n        button.SetTextColor(Color.White);')
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'root.SetGravity(GravityFlags.Center)' VoiceCraft.Server.Android/AccountActivity.cs
          grep -q 'input.SetSingleLine(true)' VoiceCraft.Server.Android/AccountActivity.cs
          grep -q 'button.SetAllCaps(false)' VoiceCraft.Server.Android/AccountActivity.cs
      - name: Commit product source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VoiceCraft.Server.Android/AccountActivity.cs
          git diff --cached --quiet && exit 0
          git commit -m "fix(account): use supported Android UI setters"
          git push origin HEAD:account-phase1
