name: Publish Endstone 0.2.1 to UI4.1 Release

on:
  push:
    branches: [publish-endstone-021-ui4.1]
    paths:
      - ".github/workflows/publish-endstone-021-ui41.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish Endstone 0.2.1 to UI4.1 release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.7.1-android-phase2-ui4.1
      VERIFIED_RUN_ID: "34125559311"
      WHEEL_SHA256: 2250ddceef5333abcbbad5345d74f31d3c21ad06a66891077da6eb3809ad75f6
      SIGNED_SHA256: cd2c91275f4d24989798ed86cb7ebbe5a9aaea95b4fd32a4e8e8fe60d2c91425
      UNSIGNED_SHA256: 106f576609d54f4d0742a6aac53bb6088288ff0850cb77ddda3e9fc102c5103a
    steps:
      - name: Download exact verified main artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$VERIFIED_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name VoiceCraft-Endstone-Phase2 \
            --dir release-assets
          test -f release-assets/endstone_voicecraft-0.2.1-py3-none-any.whl

      - name: Verify wheel and existing UI4.1 APK digests
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=release-assets/endstone_voicecraft-0.2.1-py3-none-any.whl
          echo "$WHEEL_SHA256  $WHEEL" | sha256sum -c -

          SIGNED_DIGEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Signed.apk") | .digest')
          UNSIGNED_DIGEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Unsigned.apk") | .digest')
          test "$SIGNED_DIGEST" = "sha256:$SIGNED_SHA256"
          test "$UNSIGNED_DIGEST" = "sha256:$UNSIGNED_SHA256"

      - name: Generate combined SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cat > release-assets/SHA256SUMS.txt <<EOF
          $SIGNED_SHA256  VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Signed.apk
          $UNSIGNED_SHA256  VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Unsigned.apk
          $WHEEL_SHA256  endstone_voicecraft-0.2.1-py3-none-any.whl
          EOF

      - name: Upload Endstone wheel to existing UI4.1 release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            release-assets/endstone_voicecraft-0.2.1-py3-none-any.whl \
            release-assets/SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Append Endstone 0.2.1 release notes
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/release-notes.md
          if ! grep -q 'Endstone companion plugin 0.2.1' /tmp/release-notes.md; then
            cat >> /tmp/release-notes.md <<'EOF'

          ### Endstone companion plugin 0.2.1
          - Added `endstone_voicecraft-0.2.1-py3-none-any.whl` to this same UI4.1 release.
          - Verified companion for Android `1.7.1-android-phase2-ui4.1` using Render Relay protocol `1`.
          - Strict bridge validation now checks `ws://`/`wss://`, hostname, exact `/bridge` path, Server ID length, Bridge Secret length, and placeholder/query/fragment values.
          - Improved reconnect and WebSocket close diagnostics.
          - `/vcunbind` only cancels a pending bind request; it does not unbind an already-bound VoiceCraft entity.
          - Main CI run `34125559311` verified Endstone `0.11.10`, real Endstone ↔ Node relay authentication/state/binding flow, Server-ID isolation, bad-secret rejection, relay restart/reconnect, wheel metadata, entrypoint, bundled config, and installed-wheel import.
          - Plugin source/build commit: `824b1431d4255a23edf7d891a4c405517a14900f`.
          - Wheel SHA-256: `2250ddceef5333abcbbad5345d74f31d3c21ad06a66891077da6eb3809ad75f6`.
          EOF
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.md
          fi

      - name: Verify published assets
        shell: bash
        run: |
          set -euo pipefail
          WHEEL_DIGEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="endstone_voicecraft-0.2.1-py3-none-any.whl") | .digest')
          SUMS_COUNT=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.assets[] | select(.name=="SHA256SUMS.txt")] | length')
          test "$WHEEL_DIGEST" = "sha256:$WHEEL_SHA256"
          test "$SUMS_COUNT" = "1"
          echo "Endstone 0.2.1 published to $TAG and verified."
