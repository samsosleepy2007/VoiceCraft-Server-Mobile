name: Release VoiceCraft Bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "release-manifest.json"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository and VoiceCraft v1.7.1 submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read release manifest
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_TAG=$(jq -r '.tag' release-manifest.json)" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$(jq -r '.title' release-manifest.json)" >> "$GITHUB_ENV"
          test "$(jq -r '.android.display_version' release-manifest.json)" = "1.7.1-android-phase2-ui4.5.2-account-v2-guest"
          test "$(jq -r '.android.version_code' release-manifest.json)" = "13"
          test "$(jq -r '.endstone' release-manifest.json)" = "0.2.6"
          test "$(jq -r '.relay' release-manifest.json)" = "0.2.1"
          test "$(jq -r '.protocol' release-manifest.json)" = "1"
          test "$(jq -r '.voicecraft_upstream_commit' release-manifest.json)" = "85aaccccbb58adb23e8c87144e8b1c24bf4b2011"

      - name: Verify pinned upstream version and GPL attribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C VoiceCraft.Upstream rev-parse HEAD)" = "85aaccccbb58adb23e8c87144e8b1c24bf4b2011"
          test -f LICENSE.md
          test -f NOTICE.md
          cmp -s LICENSE.md VoiceCraft.Upstream/LICENSE.md
          grep -q 'https://github.com/AvionBlock/VoiceCraft' NOTICE.md
          grep -q 'modified' NOTICE.md
          grep -q 'GPL-3.0' NOTICE.md

      - name: Apply Android headless runtime patch
        run: python tools/apply_phase1.py VoiceCraft.Upstream

      - name: Disable Spectre.Console for Android headless mode
        run: python tools/apply_android_console_fix.py VoiceCraft.Upstream

      - name: Replace HttpListener with Android TcpListener McHttp
        run: python tools/apply_android_tcp_mchttp.py VoiceCraft.Upstream

      - name: Add Endstone bridge runtime dispatcher
        run: python tools/apply_bridge_runtime.py VoiceCraft.Upstream

      - name: Apply Guest / Account V2 patch
        run: python VoiceCraft.Guest.Patch/apply_guest_account_patch.py .

      - name: Apply Open Source / Legal patch
        run: python VoiceCraft.Guest.Patch/apply_legal_compliance_patch.py .

      - name: Validate release source guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MainLauncher = true' VoiceCraft.Server.Android/AccountGateActivity.cs
          ! grep -R --include='*.cs' -n 'MainLauncher = true' VoiceCraft.Server.Android \
            | grep -v 'AccountGateActivity.cs'
          grep -q 'NoBackupFilesDir' VoiceCraft.Server.Android/KeystoreJsonStore.cs
          grep -q 'AndroidKeyStore' VoiceCraft.Server.Android/KeystoreJsonStore.cs
          grep -q 'AES/GCM/NoPadding' VoiceCraft.Server.Android/KeystoreJsonStore.cs
          grep -q 'android:allowBackup="false"' VoiceCraft.Server.Android/Properties/AndroidManifest.xml
          grep -q 'ShowOpenSourceLegal' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'https://github.com/AvionBlock/VoiceCraft' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'GPL-3.0' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q '<ApplicationVersion>13</ApplicationVersion>' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          grep -q '1.7.1-android-phase2-ui4.5.2-account-v2-guest' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          grep -q 'appVersion = "1.7.1-android-phase2-ui4.5.2-account-v2-guest"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'voicecraft-mobile' VoiceCraft.Server.Android/AccountApiConfig.cs
          ! grep -q 'voicecraft-account' VoiceCraft.Server.Android/AccountApiConfig.cs
          grep -q 'LoginAsync(this, login, password)' VoiceCraft.Server.Android/RegisteredLoginActivity.cs
          ! grep -q 'LoginAsync(this, login, password, null)' VoiceCraft.Server.Android/RegisteredLoginActivity.cs
          ! grep -Eiq 'admin|mfa|otp' VoiceCraft.Server.Android/VoiceCraftAccountClient.cs
          ! grep -Eiq 'admin|mfa|otp' VoiceCraft.Server.Android/RegisteredLoginActivity.cs
          ! grep -Eiq 'admin|mfa|otp' VoiceCraft.Server.Android/RegisteredSessionStore.cs
          ! grep -Eiq 'admin|mfa|otp' VoiceCraft.Server.Android/AccountStatusActivity.cs
          ! grep -Eiq 'admin|mfa|otp' VoiceCraft.Server.Android/AccountGateActivity.cs
          ! grep -q 'Role' VoiceCraft.Server.Android/RegisteredSessionStore.cs
          ! grep -q 'GetProperty("role")' VoiceCraft.Server.Android/VoiceCraftAccountClient.cs
          ! grep -q 'adminMfaSetupRequired' VoiceCraft.Server.Android/VoiceCraftAccountClient.cs
          grep -q 'MaxAttemptsPerRelay = 5' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'PeerTimeoutSeconds = 30' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'BackupRelayActivity' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'case "unbind"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'type = "unbind_result"' VoiceCraft.Server.Android/EndstoneBridgeController.cs

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Restore, build and publish Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          dotnet build VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj -c Release --no-restore
          dotnet publish VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj \
            -c Release \
            -r android-arm64 \
            --no-restore
          mkdir -p release-assets
          signed=$(find VoiceCraft.Server.Android/bin/Release/net10.0-android/android-arm64/publish -maxdepth 1 -name '*-Signed.apk' -print -quit)
          test -n "$signed"
          cp "$signed" release-assets/VoiceCraft-Server-Mobile-UI4.5.2-AccountV2-arm64-Signed.apk

      - name: Scan APK for removed privileged-account client markers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apk-scan
          mkdir apk-scan
          unzip -q release-assets/VoiceCraft-Server-Mobile-UI4.5.2-AccountV2-arm64-Signed.apk -d apk-scan
          if grep -R -a -E -i \
            'AdminMfaSetupRequired|adminMfaSetupRequired|/v1/admin|x-admin-otp|MFA_REQUIRED|ADMIN_REQUIRED|voicecraft-account' \
            apk-scan; then
            echo 'Removed privileged-account marker found inside APK.' >&2
            exit 1
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Endstone 0.2.6 wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build
          python -m compileall -q VoiceCraft.Endstone/src VoiceCraft.Endstone/tests
          (cd VoiceCraft.Endstone && python -m build --wheel)
          wheel=$(find VoiceCraft.Endstone/dist -maxdepth 1 -name 'endstone_voicecraft-0.2.6-*.whl' -print -quit)
          test -n "$wheel"
          cp "$wheel" release-assets/endstone_voicecraft-0.2.6-py3-none-any.whl

      - name: Validate Relay 0.2.1
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Relay syntax check
        shell: bash
        working-directory: VoiceCraft.Bridge.Relay
        run: |
          npm install --omit=dev
          npm run check

      - name: Build GPL and Corresponding Source release assets
        shell: bash
        run: |
          set -euo pipefail
          cp VoiceCraft.Upstream/LICENSE.md release-assets/GPL-3.0.txt
          cp NOTICE.md release-assets/NOTICE.md

          source_name="VoiceCraft-Server-Mobile-${RELEASE_TAG}-Corresponding-Source"
          mkdir -p "release-source/${source_name}"
          rsync -a \
            --exclude='.git' \
            --exclude='release-assets' \
            --exclude='release-source' \
            ./ "release-source/${source_name}/"

          find "release-source/${source_name}" -depth -type d \
            \( -name bin -o -name obj -o -name node_modules -o -name dist -o -name __pycache__ \) \
            -exec rm -rf {} +
          find "release-source/${source_name}" -name '.git' -delete
          find "release-source/${source_name}" -name '*.pyc' -delete

          cat > "release-source/${source_name}/SOURCE_INFO.txt" <<EOF
          VoiceCraft Server Mobile Corresponding Source
          Release tag: ${RELEASE_TAG}
          Release commit: ${GITHUB_SHA}
          Android: 1.7.1-android-phase2-ui4.5.2-account-v2-guest (version code 13)
          VoiceCraft upstream: v1.7.1
          Upstream commit: 85aaccccbb58adb23e8c87144e8b1c24bf4b2011
          Upstream: https://github.com/AvionBlock/VoiceCraft

          This archive contains the modified project source, the exact checked-out
          VoiceCraft upstream source, patch scripts, Android source, Endstone source,
          Relay source, mobile/guest account source and build/release scripts used for this release.
          See LICENSE.md and NOTICE.md.
          EOF

          (cd release-source && zip -qr "../release-assets/${source_name}.zip" "${source_name}")
          test -s "release-assets/${source_name}.zip"
          test -s release-assets/GPL-3.0.txt

      - name: Create checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            sha256sum \
              VoiceCraft-Server-Mobile-UI4.5.2-AccountV2-arm64-Signed.apk \
              endstone_voicecraft-0.2.6-py3-none-any.whl \
              GPL-3.0.txt \
              NOTICE.md \
              *-Corresponding-Source.zip \
              > SHA256SUMS.txt
          )
          cat > release-notes.md <<'EOF'
          ## VoiceCraft Server Mobile UI4.5.2 + Account V2

          Security-isolation patch for the Android/mobile account client.

          ### Versions
          - Android: `1.7.1-android-phase2-ui4.5.2-account-v2-guest` (version code `13`)
          - Endstone: `0.2.6`
          - Render Relay: `0.2.1`
          - Bridge protocol: `1`
          - VoiceCraft upstream: `v1.7.1` pinned to `85aaccccbb58adb23e8c87144e8b1c24bf4b2011`

          ### Mobile account isolation
          - Android now talks only to the dedicated `voicecraft-mobile` account endpoint.
          - The APK contains no privileged-account role field, privileged OTP/MFA handling, privileged response flags, or privileged management API route.
          - Registered mobile sessions store only token, account ID, login name and expiry.
          - The dedicated mobile endpoint returns only registered-user session data and does not expose role information.
          - Privileged account management remains server-side and is not part of the Android application.
          - Release CI scans both source and the produced APK for removed privileged-account client markers.

          ### Existing functionality preserved
          - Registered Account + device-local Free Account.
          - AES-GCM + Android Keystore local storage and Android backup exclusion.
          - Open Source & Legal information in Settings.
          - Primary + Backup Render relay failover.
          - Real `/vc` unbind using `requestId + entityId`.
          - Unexpected disconnect Auto Rebind behavior.
          - Bedrock relay status alerts.

          ### Assets
          - `VoiceCraft-Server-Mobile-UI4.5.2-AccountV2-arm64-Signed.apk`
          - `endstone_voicecraft-0.2.6-py3-none-any.whl`
          - `VoiceCraft-Server-Mobile-...-Corresponding-Source.zip`
          - `GPL-3.0.txt`
          - `NOTICE.md`
          - `SHA256SUMS.txt`

          ### Original VoiceCraft project
          - https://github.com/AvionBlock/VoiceCraft
          - https://gitlab.avion.team/voicecraft/VoiceCraft

          ### Current networking limitation
          Render WSS carries control/state/binding traffic only. Voice audio still uses UDP directly to Android.
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --latest
          fi
