name: Build Endstone Plugin

on:
  workflow_dispatch:
  push:
    branches: [main, endstone-phase2, endstone-0.2.1-ui4.1-release]
    paths:
      - "VoiceCraft.Endstone/**"
      - "VoiceCraft.Bridge.Relay/**"
      - ".github/workflows/build-endstone.yml"
  pull_request:
    branches: [main]
    paths:
      - "VoiceCraft.Endstone/**"
      - "VoiceCraft.Bridge.Relay/**"
      - ".github/workflows/build-endstone.yml"

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build and Endstone API
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "endstone==0.11.10" "aiohttp>=3.9"

      - name: Compile plugin source and tests
        run: python -m compileall -q VoiceCraft.Endstone/src VoiceCraft.Endstone/tests

      - name: Validate Endstone API, /vc menu, auto-bind, auto-rebind, spawn filter and bridge config
        env:
          PYTHONPATH: VoiceCraft.Endstone/src
        run: |
          python - <<'PY'
          import inspect
          from endstone.event import PlayerJoinEvent, PlayerQuitEvent
          from endstone.form import ActionForm, ModalForm, TextInput
          from endstone_voicecraft import VoiceCraftEndstone
          from endstone_voicecraft.auto_bind import VoiceCraftEndstone as AutoBindVoiceCraftEndstone
          from endstone_voicecraft.auto_rebind import VoiceCraftEndstone as AutoRebindVoiceCraftEndstone
          from endstone_voicecraft.menu import VoiceCraftEndstone as MenuVoiceCraftEndstone
          from endstone_voicecraft.compat import CompatibleEndstoneRelayClient
          from endstone_voicecraft.listener import VoiceCraftListener
          from endstone_voicecraft.model import PlayerState

          join_annotation = inspect.signature(VoiceCraftListener.on_player_join).parameters["event"].annotation
          quit_annotation = inspect.signature(VoiceCraftListener.on_player_quit).parameters["event"].annotation
          assert join_annotation is PlayerJoinEvent, repr(join_annotation)
          assert quit_annotation is PlayerQuitEvent, repr(quit_annotation)
          assert inspect.isclass(join_annotation)
          assert inspect.isclass(quit_annotation)

          valid = PlayerState("Test", "1", "u", "Overworld", 0.0, 70.0, 0.0, 5.0, -2.0)
          sentinel = PlayerState("Test", "1", "u", "Overworld", 0.0, 32768.0, 0.0, 0.0, 0.0)
          assert VoiceCraftEndstone._valid_state(valid)
          assert not VoiceCraftEndstone._valid_state(sentinel)
          assert VoiceCraftEndstone is MenuVoiceCraftEndstone
          assert issubclass(MenuVoiceCraftEndstone, AutoRebindVoiceCraftEndstone)
          assert issubclass(AutoRebindVoiceCraftEndstone, AutoBindVoiceCraftEndstone)
          assert VoiceCraftEndstone.version == "0.2.4"
          assert CompatibleEndstoneRelayClient is not None
          assert ActionForm is not None and ModalForm is not None and TextInput is not None

          # Regression guard: Endstone 0.11 builds PluginDescription from
          # cls.__dict__, not inherited class attributes. The final exported
          # class must therefore own all command/permission metadata directly.
          direct = VoiceCraftEndstone.__dict__
          assert direct["api_version"] == "0.11"
          assert set(direct["commands"]) == {"vc"}, direct["commands"]
          assert direct["commands"]["vc"]["usages"] == ["/vc"]
          assert direct["commands"]["vc"]["permissions"] == ["voicecraft.command.menu"]
          assert "permissions" in direct
          assert direct["permissions"]["voicecraft.command.menu"]["default"] is True
          assert direct["permissions"]["voicecraft.command.bind"]["default"] is True
          assert direct["permissions"]["voicecraft.command.status"]["default"] is True
          assert direct["permissions"]["voicecraft.command.dump"]["default"] == "op"
          assert "vcbind" not in direct["commands"]
          assert "vcunbind" not in direct["commands"]
          assert "vcstatus" not in direct["commands"]
          assert "vcdump" not in direct["commands"]

          extract = VoiceCraftEndstone._extract_binding_key
          assert extract(["Ab3X9"]) == "Ab3X9"
          assert extract('["Ab3X9"]') == "Ab3X9"
          assert extract({"bindingKey": " Ab3X9 "}) == "Ab3X9"
          assert extract("") == ""
          assert VoiceCraftEndstone._AUTO_FORM_DELAY_TICKS >= 1
          assert VoiceCraftEndstone._AUTO_FORM_RETRY_TICKS >= 1
          assert VoiceCraftEndstone._RECONNECT_FORM_DELAY_TICKS == 100

          good = (True, "wss://voicecraft-server-mobile.onrender.com/bridge", "mcsv-main", "0123456789abcdef0123456789abcdef")
          ok, reason = VoiceCraftEndstone._validate_bridge_config(*good)
          assert ok, reason
          assert not VoiceCraftEndstone._validate_bridge_config(True, "https://host/bridge", "mcsv-main", "0123456789abcdef")[0]
          assert not VoiceCraftEndstone._validate_bridge_config(True, "wss://host/", "mcsv-main", "0123456789abcdef")[0]
          assert not VoiceCraftEndstone._validate_bridge_config(True, "wss://host/bridge?x=1", "mcsv-main", "0123456789abcdef")[0]
          assert not VoiceCraftEndstone._validate_bridge_config(True, "wss://host/bridge", "mcsv-main", "short")[0]
          assert not VoiceCraftEndstone._validate_bridge_config(True, "wss://host/bridge", "x" * 101, "0123456789abcdef")[0]
          assert not VoiceCraftEndstone._validate_bridge_config(True, "wss://YOUR-RELAY.onrender.com/bridge", "mcsv-main", "0123456789abcdef")[0]
          print("Endstone 0.2.4 /vc menu metadata, auto-bind/rebind, spawn filter, and bridge validation OK")
          PY

      - name: Install Render relay dependencies
        working-directory: VoiceCraft.Bridge.Relay
        run: npm install --omit=dev

      - name: Run real Endstone protocol-1 / Render relay contract
        env:
          PYTHONPATH: VoiceCraft.Endstone/src
        run: python VoiceCraft.Endstone/tests/relay_contract_021.py

      - name: Build wheel
        working-directory: VoiceCraft.Endstone
        run: python -m build --wheel

      - name: Validate wheel contents, metadata and entrypoint
        working-directory: VoiceCraft.Endstone
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          assert "0.2.4" in wheel, wheel
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
              assert "endstone_voicecraft/config.toml" in names, names
              assert "endstone_voicecraft/bridge.py" in names, names
              assert "endstone_voicecraft/compat.py" in names, names
              assert "endstone_voicecraft/auto_bind.py" in names, names
              assert "endstone_voicecraft/auto_rebind.py" in names, names
              assert "endstone_voicecraft/menu.py" in names, names
              assert "endstone_voicecraft/plugin.py" in names, names

              metadata = [name for name in names if name.endswith(".dist-info/METADATA")]
              assert metadata, names
              metadata_text = zf.read(metadata[0]).decode("utf-8")
              assert "Version: 0.2.4" in metadata_text, metadata_text

              entry = [name for name in names if name.endswith(".dist-info/entry_points.txt")]
              assert entry, names
              entry_text = zf.read(entry[0]).decode("utf-8")
              assert "voicecraft = endstone_voicecraft:VoiceCraftEndstone" in entry_text, entry_text
          print(f"Validated {wheel}")
          PY

          python -m pip install --no-deps --force-reinstall dist/*.whl
          python - <<'PY'
          import inspect
          from endstone.event import PlayerJoinEvent, PlayerQuitEvent
          from endstone.form import ActionForm, ModalForm, TextInput
          from endstone_voicecraft import VoiceCraftEndstone
          from endstone_voicecraft.auto_rebind import VoiceCraftEndstone as AutoRebindVoiceCraftEndstone
          from endstone_voicecraft.menu import VoiceCraftEndstone as MenuVoiceCraftEndstone
          from endstone_voicecraft.compat import CompatibleEndstoneRelayClient
          from endstone_voicecraft.listener import VoiceCraftListener

          assert VoiceCraftEndstone is MenuVoiceCraftEndstone
          assert issubclass(VoiceCraftEndstone, AutoRebindVoiceCraftEndstone)
          assert VoiceCraftEndstone.api_version == "0.11"
          assert VoiceCraftEndstone.version == "0.2.4"
          assert set(VoiceCraftEndstone.__dict__["commands"]) == {"vc"}
          assert "permissions" in VoiceCraftEndstone.__dict__
          assert inspect.signature(VoiceCraftListener.on_player_join).parameters["event"].annotation is PlayerJoinEvent
          assert inspect.signature(VoiceCraftListener.on_player_quit).parameters["event"].annotation is PlayerQuitEvent
          assert CompatibleEndstoneRelayClient is not None
          assert ActionForm is not None and ModalForm is not None and TextInput is not None
          assert VoiceCraftEndstone._extract_binding_key('["Ab3X9"]') == "Ab3X9"
          assert VoiceCraftEndstone._RECONNECT_FORM_DELAY_TICKS == 100
          print("Endstone 0.2.4 installed wheel import, /vc metadata and auto-rebind entrypoint OK")
          PY

      - name: Upload Endstone wheel
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-Endstone-Phase2
          if-no-files-found: error
          path: VoiceCraft.Endstone/dist/*.whl
