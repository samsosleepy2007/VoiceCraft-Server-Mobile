name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, endstone-phase2, modern-azure-ui, feature-item-mic-integration]
    paths:
      - "VoiceCraft.Upstream"
      - "VoiceCraft.Server.Android/**"
      - "VoiceCraft.Endstone/**"
      - "VoiceCraft.Guest.Patch/**"
      - "supabase/functions/voicecraft-mobile/**"
      - "LICENSE.md"
      - "NOTICE.md"
      - "tools/apply_phase1.py"
      - "tools/apply_android_console_fix.py"
      - "tools/apply_android_tcp_mchttp.py"
      - "tools/apply_bridge_runtime.py"
      - "tools/apply_item_mic_bridge_patch.py"
      - ".github/workflows/build-android.yml"
      - ".gitmodules"
  pull_request:
    branches: [main]
    paths:
      - "VoiceCraft.Upstream"
      - "VoiceCraft.Server.Android/**"
      - "VoiceCraft.Endstone/**"
      - "VoiceCraft.Guest.Patch/**"
      - "supabase/functions/voicecraft-mobile/**"
      - "LICENSE.md"
      - "NOTICE.md"
      - "tools/apply_phase1.py"
      - "tools/apply_android_console_fix.py"
      - "tools/apply_android_tcp_mchttp.py"
      - "tools/apply_bridge_runtime.py"
      - "tools/apply_item_mic_bridge_patch.py"
      - ".github/workflows/build-android.yml"
      - ".gitmodules"

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository and VoiceCraft v1.7.1 submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned upstream version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C VoiceCraft.Upstream rev-parse HEAD)" = "85aaccccbb58adb23e8c87144e8b1c24bf4b2011"
          test -f LICENSE.md
          test -f NOTICE.md
          cmp -s LICENSE.md VoiceCraft.Upstream/LICENSE.md

      - name: Apply Android headless runtime patch
        run: python tools/apply_phase1.py VoiceCraft.Upstream

      - name: Disable Spectre.Console for Android headless mode
        run: python tools/apply_android_console_fix.py VoiceCraft.Upstream

      - name: Replace HttpListener with Android TcpListener McHttp
        run: python tools/apply_android_tcp_mchttp.py VoiceCraft.Upstream

      - name: Add Endstone bridge runtime dispatcher
        run: python tools/apply_bridge_runtime.py VoiceCraft.Upstream

      - name: Apply Guest / Account V2 patch
        run: python VoiceCraft.Guest.Patch/apply_guest_account_patch.py .

      - name: Apply Item Mic bridge patch
        run: python tools/apply_item_mic_bridge_patch.py .

      - name: Apply Open Source / Legal patch
        run: python VoiceCraft.Guest.Patch/apply_legal_compliance_patch.py .

      - name: Validate UI4.5.2 mobile account isolation and legal guards
        shell: bash
        run: |
          set -euo pipefail
          test -f VoiceCraft.Server.Android/AccountGateActivity.cs
          test -f VoiceCraft.Server.Android/GuestAccountStore.cs
          test -f VoiceCraft.Server.Android/RegisteredSessionStore.cs
          test -f VoiceCraft.Server.Android/Resources/xml/backup_rules.xml
          test -f VoiceCraft.Server.Android/Resources/xml/data_extraction_rules.xml
          test -f supabase/functions/voicecraft-mobile/index.ts
          grep -q 'MainLauncher = true' VoiceCraft.Server.Android/AccountGateActivity.cs
          ! grep -R --include='*.cs' -n 'MainLauncher = true' VoiceCraft.Server.Android \
            | grep -v 'AccountGateActivity.cs'
          grep -q 'NoBackupFilesDir' VoiceCraft.Server.Android/KeystoreJsonStore.cs
          grep -q 'AndroidKeyStore' VoiceCraft.Server.Android/KeystoreJsonStore.cs
          grep -q 'AES/GCM/NoPadding' VoiceCraft.Server.Android/KeystoreJsonStore.cs
          grep -q 'voicecraft-mobile' VoiceCraft.Server.Android/AccountApiConfig.cs
          ! grep -q 'voicecraft-account' VoiceCraft.Server.Android/AccountApiConfig.cs
          grep -q 'voicecraft-guest' VoiceCraft.Server.Android/AccountApiConfig.cs
          grep -q 'LoginAsync(this, login, password)' VoiceCraft.Server.Android/RegisteredLoginActivity.cs
          ! grep -q 'LoginAsync(this, login, password, null)' VoiceCraft.Server.Android/RegisteredLoginActivity.cs
          ! grep -Eiq 'admin|mfa|otp' VoiceCraft.Server.Android/VoiceCraftAccountClient.cs
          ! grep -Eiq 'admin|mfa|otp' VoiceCraft.Server.Android/RegisteredLoginActivity.cs
          ! grep -Eiq 'admin|mfa|otp' VoiceCraft.Server.Android/RegisteredSessionStore.cs
          ! grep -Eiq 'admin|mfa|otp' VoiceCraft.Server.Android/AccountStatusActivity.cs
          ! grep -Eiq 'admin|mfa|otp' VoiceCraft.Server.Android/AccountGateActivity.cs
          ! grep -q 'Role' VoiceCraft.Server.Android/RegisteredSessionStore.cs
          ! grep -q 'GetProperty("role")' VoiceCraft.Server.Android/VoiceCraftAccountClient.cs
          ! grep -q 'adminMfaSetupRequired' VoiceCraft.Server.Android/VoiceCraftAccountClient.cs
          grep -q 'OpenAccountCenter' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'ShowOpenSourceLegal' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'https://github.com/AvionBlock/VoiceCraft' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'GPL-3.0' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'android:allowBackup="false"' VoiceCraft.Server.Android/Properties/AndroidManifest.xml
          grep -q 'android:icon="@drawable/voicecraft_logo"' VoiceCraft.Server.Android/Properties/AndroidManifest.xml
          grep -q '<ApplicationVersion>13</ApplicationVersion>' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          grep -q '1.7.1-android-phase2-ui4.5.2-account-v2-guest' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          grep -q 'appVersion = "1.7.1-android-phase2-ui4.5.2-account-v2-guest"' VoiceCraft.Server.Android/EndstoneBridgeController.cs

      - name: Validate multi-relay, unbind and Item Mic guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MaxAttemptsPerRelay = 5' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'PeerTimeoutSeconds = 30' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'BackupRelayActivity' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'ExtraBridgeBackupUrls' VoiceCraft.Server.Android/ServerPreferences.cs
          grep -q 'BridgeUnbindRequest' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'case "unbind"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'type = "unbind_result"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'VoiceCraft.DisconnectReason.Kicked' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q '_manualUnbindByEntity' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'bridgeVersion = "0.2.6"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'bool? MicOn' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'state.MicOn.HasValue' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'entity.ServerMuted = serverMuted' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'root.TryGetProperty("micOn"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          test -f VoiceCraft.Endstone/src/endstone_voicecraft/item_mic.py
          grep -q 'version = "0.2.7"' VoiceCraft.Endstone/src/endstone_voicecraft/item_mic.py
          grep -q 'message\["micOn"\] = mic_on' VoiceCraft.Endstone/src/endstone_voicecraft/item_mic.py
          grep -q 'from .item_mic import VoiceCraftEndstone' VoiceCraft.Endstone/src/endstone_voicecraft/__init__.py
          grep -q 'version = "0.2.7"' VoiceCraft.Endstone/pyproject.toml

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj

      - name: Build Android project
        run: dotnet build VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj -c Release --no-restore

      - name: Publish Android ARM64 APK
        run: >-
          dotnet publish VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          -c Release
          -r android-arm64
          --no-restore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-Server-Android-arm64-UI4.5.2-AccountV2-ItemMic
          if-no-files-found: error
          path: VoiceCraft.Server.Android/bin/Release/net10.0-android/android-arm64/publish/*.apk

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Endstone 0.2.7 Item Mic wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build
          python -m compileall -q VoiceCraft.Endstone/src VoiceCraft.Endstone/tests
          (cd VoiceCraft.Endstone && python -m build --wheel)
          wheel=$(find VoiceCraft.Endstone/dist -maxdepth 1 -name 'endstone_voicecraft-0.2.7-*.whl' -print -quit)
          test -n "$wheel"
          mkdir -p test-assets
          cp "$wheel" test-assets/endstone_voicecraft-0.2.7-py3-none-any.whl

      - name: Upload Endstone Item Mic wheel
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-Endstone-0.2.7-ItemMic
          if-no-files-found: error
          path: test-assets/endstone_voicecraft-0.2.7-py3-none-any.whl
