name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, endstone-phase2, modern-azure-ui]
    paths:
      - "VoiceCraft.Upstream"
      - "VoiceCraft.Server.Android/**"
      - "tools/apply_phase1.py"
      - "tools/apply_android_console_fix.py"
      - "tools/apply_android_tcp_mchttp.py"
      - "tools/apply_bridge_runtime.py"
      - ".github/workflows/build-android.yml"
      - ".gitmodules"
  pull_request:
    branches: [main]
    paths:
      - "VoiceCraft.Upstream"
      - "VoiceCraft.Server.Android/**"
      - "tools/apply_phase1.py"
      - "tools/apply_android_console_fix.py"
      - "tools/apply_android_tcp_mchttp.py"
      - "tools/apply_bridge_runtime.py"
      - ".github/workflows/build-android.yml"
      - ".gitmodules"

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository and VoiceCraft v1.7.1 submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned upstream version
        shell: bash
        run: |
          test "$(git -C VoiceCraft.Upstream rev-parse HEAD)" = "85aaccccbb58adb23e8c87144e8b1c24bf4b2011"

      - name: Apply Android headless runtime patch
        run: python tools/apply_phase1.py VoiceCraft.Upstream

      - name: Disable Spectre.Console for Android headless mode
        run: python tools/apply_android_console_fix.py VoiceCraft.Upstream

      - name: Replace HttpListener with Android TcpListener McHttp
        run: python tools/apply_android_tcp_mchttp.py VoiceCraft.Upstream

      - name: Add Endstone bridge runtime dispatcher
        run: python tools/apply_bridge_runtime.py VoiceCraft.Upstream

      - name: Validate UI4.5 account, multi-relay and real-unbind source guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MainLauncher = true' VoiceCraft.Server.Android/AccountActivity.cs
          grep -q 'MainLauncher = false' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'AccountActivity.LaunchManage(this)' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'ProjectUrl = "https://azzmvholzjucmzhqitwa.supabase.co"' VoiceCraft.Server.Android/SupabaseConfig.cs
          grep -q 'sb_publishable_' VoiceCraft.Server.Android/SupabaseConfig.cs
          grep -q 'auth/v1/token?grant_type=password' VoiceCraft.Server.Android/SupabaseAuthClient.cs
          grep -q 'auth/v1/signup' VoiceCraft.Server.Android/SupabaseAuthClient.cs
          grep -q 'auth/v1/recover' VoiceCraft.Server.Android/SupabaseAuthClient.cs
          grep -q 'grant_type=refresh_token' VoiceCraft.Server.Android/SupabaseAuthClient.cs
          grep -q 'AndroidKeyStore' VoiceCraft.Server.Android/AccountSessionStore.cs
          grep -q 'AES/GCM/NoPadding' VoiceCraft.Server.Android/AccountSessionStore.cs
          grep -q 'MaxAttemptsPerRelay = 5' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'PeerTimeoutSeconds = 30' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'BackupRelayActivity' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'ExtraBridgeBackupUrls' VoiceCraft.Server.Android/ServerPreferences.cs
          grep -q 'BridgeUnbindRequest' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'case "unbind"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'type = "unbind_result"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'VoiceCraft.DisconnectReason.Kicked' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q '_manualUnbindByEntity' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'appVersion = "1.7.1-android-phase2-ui4.5"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'bridgeVersion = "0.2.6"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'ApplicationVersion>11<' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          grep -q '1.7.1-android-phase2-ui4.5' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: dotnet restore VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj

      - name: Publish Android ARM64 APK
        run: >-
          dotnet publish VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          -c Release
          -r android-arm64
          --no-restore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-Server-Android-arm64-UI4.5-AccountPhase1
          if-no-files-found: error
          path: VoiceCraft.Server.Android/bin/Release/net10.0-android/android-arm64/publish/*.apk
