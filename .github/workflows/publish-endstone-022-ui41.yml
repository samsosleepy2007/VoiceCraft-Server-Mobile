name: Publish Endstone 0.2.2 to UI4.1 Release

on:
  push:
    branches: [publish-endstone-022-ui4.1]
    paths:
      - ".github/workflows/publish-endstone-022-ui41.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: v1.7.1-android-phase2-ui4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "endstone==0.11.10" "aiohttp>=3.9"
          npm install --omit=dev --prefix VoiceCraft.Bridge.Relay

      - name: Validate source and relay contract
        env:
          PYTHONPATH: VoiceCraft.Endstone/src
        run: |
          python -m compileall -q VoiceCraft.Endstone/src VoiceCraft.Endstone/tests
          python VoiceCraft.Endstone/tests/relay_contract_021.py
          python - <<'PY'
          from endstone.form import ModalForm, TextInput
          from endstone_voicecraft import VoiceCraftEndstone
          from endstone_voicecraft.auto_bind import VoiceCraftEndstone as AutoBindVoiceCraftEndstone

          assert VoiceCraftEndstone is AutoBindVoiceCraftEndstone
          assert VoiceCraftEndstone.version == "0.2.2"
          assert ModalForm is not None and TextInput is not None
          assert VoiceCraftEndstone._extract_binding_key('["Ab3X9"]') == "Ab3X9"
          print("Endstone 0.2.2 auto-bind source validation OK")
          PY

      - name: Build and validate wheel
        run: |
          cd VoiceCraft.Endstone
          python -m build --wheel
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/endstone_voicecraft-0.2.2-*.whl")
          assert len(wheel) == 1, wheel
          with zipfile.ZipFile(wheel[0]) as zf:
              names = set(zf.namelist())
              assert "endstone_voicecraft/auto_bind.py" in names
              assert "endstone_voicecraft/compat.py" in names
              assert "endstone_voicecraft/config.toml" in names
              metadata = [n for n in names if n.endswith(".dist-info/METADATA")]
              assert metadata
              assert "Version: 0.2.2" in zf.read(metadata[0]).decode("utf-8")
          print(wheel[0])
          PY

      - name: Prepare release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG" -p '*.apk' -p '*.whl' -D release-assets
          cp VoiceCraft.Endstone/dist/endstone_voicecraft-0.2.2-py3-none-any.whl release-assets/
          (
            cd release-assets
            sha256sum *.apk *.whl | sort -k2 > ../SHA256SUMS.txt
          )
          cat SHA256SUMS.txt

      - name: Upload Endstone 0.2.2 and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            VoiceCraft.Endstone/dist/endstone_voicecraft-0.2.2-py3-none-any.whl \
            SHA256SUMS.txt \
            --clobber

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json body -q .body > release-body.md
          if ! grep -q "Endstone companion plugin 0.2.2" release-body.md; then
            cat >> release-body.md <<'EOF'

          ### Endstone companion plugin 0.2.2
          - Added `endstone_voicecraft-0.2.2-py3-none-any.whl` to this same Android UI4.1 release.
          - Automatically opens a Minecraft Bedrock `ModalForm` for newly joined players that are not yet bound after their spawn position becomes valid.
          - The form accepts the VoiceCraft Binding Key and submits through the existing secure bind path; `/vcbind <key>` remains available as a fallback.
          - Closing the form while still unbound shows the reminder that the microphone cannot be used until binding is completed.
          - A rejected/wrong/expired key re-opens the form automatically so the player can correct it without typing a command.
          - Keeps the BDS pre-spawn `Y=32768` filter and never intentionally logs Binding Keys or the Bridge Secret.
          - Remains compatible with Android `1.7.1-android-phase2-ui4.1` and Render Relay protocol `1`; no Android APK or relay protocol change is required for this feature.
          - Endstone 0.11.10 / form API / protocol-1 relay contract validation passed in CI run `34143381596`.
          - Source merged to main in commit `eeb58871bd739fe2db40ddbac65180d97960f641`.
          EOF
          fi
          gh release edit "$TAG" --notes-file release-body.md

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json assets,body > release.json
          python - <<'PY'
          import json
          data = json.load(open("release.json", encoding="utf-8"))
          names = {asset["name"] for asset in data["assets"]}
          assert "endstone_voicecraft-0.2.2-py3-none-any.whl" in names, names
          assert "SHA256SUMS.txt" in names, names
          assert "Endstone companion plugin 0.2.2" in data["body"]
          print("Release verification OK")
          PY
