name: Restructure UI4.1 Releases

on:
  push:
    branches: [release-versioning-022]
    paths:
      - ".github/workflows/restructure-ui41-releases.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_TAG: v1.7.1-android-phase2-ui4.1
      OLD_TAG: v1.7.1-android-phase2-ui4.1-endstone0.2.1
      NEW_TAG: v1.7.1-android-phase2-ui4.1-endstone0.2.2
      OLD_TARGET: 824b1431d4255a23edf7d891a4c405517a14900f
      NEW_TARGET: eeb58871bd739fe2db40ddbac65180d97960f641
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p staging
          gh release download "$SOURCE_TAG" \
            -p 'VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Signed.apk' \
            -p 'VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Unsigned.apk' \
            -p 'endstone_voicecraft-0.2.1-py3-none-any.whl' \
            -p 'endstone_voicecraft-0.2.2-py3-none-any.whl' \
            -D staging
          test -f staging/VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Signed.apk
          test -f staging/VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Unsigned.apk
          test -f staging/endstone_voicecraft-0.2.1-py3-none-any.whl
          test -f staging/endstone_voicecraft-0.2.2-py3-none-any.whl

      - name: Verify known asset hashes
        run: |
          echo 'cd2c91275f4d24989798ed86cb7ebbe5a9aaea95b4fd32a4e8e8fe60d2c91425  staging/VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Signed.apk' | sha256sum -c -
          echo '106f576609d54f4d0742a6aac53bb6088288ff0850cb77ddda3e9fc102c5103a  staging/VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Unsigned.apk' | sha256sum -c -
          echo '2250ddceef5333abcbbad5345d74f31d3c21ad06a66891077da6eb3809ad75f6  staging/endstone_voicecraft-0.2.1-py3-none-any.whl' | sha256sum -c -
          echo 'c2402bfb8ec767050b8bead3f2b472778b684a4381cc5ba3728608445caa5870  staging/endstone_voicecraft-0.2.2-py3-none-any.whl' | sha256sum -c -

      - name: Prepare version-matched asset sets
        run: |
          mkdir -p old-release new-release
          cp staging/VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Signed.apk old-release/
          cp staging/VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Unsigned.apk old-release/
          cp staging/endstone_voicecraft-0.2.1-py3-none-any.whl old-release/
          cp staging/VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Signed.apk new-release/
          cp staging/VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Unsigned.apk new-release/
          cp staging/endstone_voicecraft-0.2.2-py3-none-any.whl new-release/
          (cd old-release && sha256sum *.apk *.whl | sort -k2 > SHA256SUMS.txt)
          (cd new-release && sha256sum *.apk *.whl | sort -k2 > SHA256SUMS.txt)

      - name: Prepare release notes
        run: |
          cat > old-release/RELEASE_NOTES.md <<'EOF'
          ## VoiceCraft Server Mobile UI4.1 + Endstone 0.2.1

          Android version: `1.7.1-android-phase2-ui4.1`  
          Android version code: `7`  
          Endstone plugin: `0.2.1`  
          Render Relay protocol: `1`

          ### Android UI4.1
          - Fixes the UI4 button-dispatch issue where touch animation could consume native click actions.
          - Preserves Thai/English UI, light/dark themes, Render preflight, Endstone config generator, diagnostics and VoiceCraft v1.7.1 compatibility.

          ### Endstone 0.2.1
          - Strict bridge URL / Server ID / Bridge Secret validation.
          - Improved reconnect and WebSocket-close diagnostics.
          - `/vcunbind` only cancels a pending bind request; it does not unbind an already-bound voice entity.
          - Verified with Endstone 0.11.10 and Render Relay protocol 1.

          ### Files
          - `VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Signed.apk`
          - `VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Unsigned.apk`
          - `endstone_voicecraft-0.2.1-py3-none-any.whl`
          - `SHA256SUMS.txt`

          > Voice audio still uses direct VoiceCraft/LiteNetLib UDP to Android. Render carries player-state and binding control data only.
          EOF

          cat > new-release/RELEASE_NOTES.md <<'EOF'
          ## VoiceCraft Server Mobile UI4.1 + Endstone 0.2.2

          Android version: `1.7.1-android-phase2-ui4.1`  
          Android version code: `7`  
          Endstone plugin: `0.2.2`  
          Render Relay protocol: `1`

          ### New in Endstone 0.2.2
          - Automatically opens a Minecraft Bedrock `ModalForm` for a newly joined player after the real spawn position becomes valid when the player is not yet bound.
          - The form accepts the VoiceCraft Binding Key and submits through the existing `/vcbind` binding path.
          - Closing the form while still unbound warns that the microphone cannot be used until binding is completed and keeps `/vcbind <key>` available as a fallback.
          - Wrong / expired keys can reopen the form automatically after a rejected `bind_result`.
          - Keeps the pre-spawn `Y=32768` filter and never intentionally logs Binding Keys or the Bridge Secret.
          - Remains compatible with Android UI4.1 and Render Relay protocol 1; the Android APK is unchanged from the UI4.1 build.

          ### Android UI4.1
          - Same signed and unsigned APK binaries as the UI4.1 / Endstone 0.2.1 release.
          - Android version code remains `7` because this release updates only the Endstone companion plugin.

          ### Files
          - `VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Signed.apk`
          - `VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Unsigned.apk`
          - `endstone_voicecraft-0.2.2-py3-none-any.whl`
          - `SHA256SUMS.txt`

          Validation: Endstone 0.11.10 / form API / protocol-1 relay contract CI run `34143381596` succeeded.  
          Source: `eeb58871bd739fe2db40ddbac65180d97960f641`.

          > Voice audio still uses direct VoiceCraft/LiteNetLib UDP to Android. Render carries player-state and binding control data only.
          EOF

      - name: Create corrected historical release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$OLD_TAG" >/dev/null 2>&1; then
            gh release delete "$OLD_TAG" -y --cleanup-tag
          fi
          gh release create "$OLD_TAG" \
            --target "$OLD_TARGET" \
            --title 'VoiceCraft Server Mobile UI4.1 + Endstone 0.2.1' \
            --notes-file old-release/RELEASE_NOTES.md \
            old-release/VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Signed.apk \
            old-release/VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Unsigned.apk \
            old-release/endstone_voicecraft-0.2.1-py3-none-any.whl \
            old-release/SHA256SUMS.txt

      - name: Create latest 0.2.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            gh release delete "$NEW_TAG" -y --cleanup-tag
          fi
          gh release create "$NEW_TAG" \
            --target "$NEW_TARGET" \
            --title 'VoiceCraft Server Mobile UI4.1 + Endstone 0.2.2' \
            --notes-file new-release/RELEASE_NOTES.md \
            --latest \
            new-release/VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Signed.apk \
            new-release/VoiceCraft-Server-Mobile-1.7.1-phase2-ui4.1-arm64-Unsigned.apk \
            new-release/endstone_voicecraft-0.2.2-py3-none-any.whl \
            new-release/SHA256SUMS.txt

      - name: Verify both version-matched releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$OLD_TAG" --json tagName,assets > old.json
          gh release view "$NEW_TAG" --json tagName,assets > new.json
          python - <<'PY'
          import json

          old = json.load(open('old.json', encoding='utf-8'))
          new = json.load(open('new.json', encoding='utf-8'))
          old_names = {a['name'] for a in old['assets']}
          new_names = {a['name'] for a in new['assets']}

          assert old['tagName'].endswith('endstone0.2.1')
          assert 'endstone_voicecraft-0.2.1-py3-none-any.whl' in old_names
          assert 'endstone_voicecraft-0.2.2-py3-none-any.whl' not in old_names
          assert new['tagName'].endswith('endstone0.2.2')
          assert 'endstone_voicecraft-0.2.2-py3-none-any.whl' in new_names
          assert 'endstone_voicecraft-0.2.1-py3-none-any.whl' not in new_names
          assert 'SHA256SUMS.txt' in old_names and 'SHA256SUMS.txt' in new_names
          print('Version-matched release verification OK')
          PY

      - name: Remove superseded generic release/tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$SOURCE_TAG" -y --cleanup-tag

      - name: Verify latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq .tag_name)"
          test "$latest" = "$NEW_TAG"
          echo "Latest release: $latest"
