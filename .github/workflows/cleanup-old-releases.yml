name: Cleanup Old Releases

on:
  push:
    branches:
      - fix-github-plugin-download-v3
    paths:
      - .github/workflows/cleanup-old-releases.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          latest_id="$(gh api "repos/${REPOSITORY}/releases/latest" --jq '.id')"
          latest_tag="$(gh api "repos/${REPOSITORY}/releases/latest" --jq '.tag_name')"
          echo "Keeping latest release: ${latest_tag} (${latest_id})"

          gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | [.id, .tag_name] | @tsv' |
          while IFS=$'\t' read -r release_id release_tag; do
            if [[ -z "${release_id}" || "${release_id}" == "${latest_id}" ]]; then
              continue
            fi

            echo "Deleting old release: ${release_tag} (${release_id})"
            gh api --method DELETE "repos/${REPOSITORY}/releases/${release_id}"
          done

          remaining="$(gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" --jq '[.[] | select(.draft == false)] | length' | awk '{s += $1} END {print s+0}')"
          echo "Published releases remaining: ${remaining}"
          if [[ "${remaining}" -ne 1 ]]; then
            echo "Expected exactly one published release after cleanup." >&2
            exit 1
          fi
