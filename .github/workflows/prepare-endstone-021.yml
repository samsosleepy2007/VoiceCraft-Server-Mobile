name: Prepare Endstone 0.2.1

on:
  push:
    branches: [endstone-0.2.1-ui4.1-release]
    paths:
      - ".github/workflows/prepare-endstone-021.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Endstone 0.2.1 patch automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: endstone-0.2.1-ui4.1-release
          fetch-depth: 0

      - name: Patch Endstone 0.2.1 source and docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def need(text, old, label):
              if old not in text:
                  raise SystemExit(f"missing patch target: {label}")

          # plugin.py
          p = Path("VoiceCraft.Endstone/src/endstone_voicecraft/plugin.py")
          s = p.read_text()
          need(s, "import uuid\nfrom typing import Any\n", "plugin imports")
          s = s.replace("import uuid\nfrom typing import Any\n", "import uuid\nfrom typing import Any\nfrom urllib.parse import urlparse\n", 1)
          need(s, 'version = "0.2.0"', "plugin version")
          s = s.replace('version = "0.2.0"', 'version = "0.2.1"', 1)
          s = s.replace('"description": "Clear a pending VoiceCraft bind request"', '"description": "Cancel a pending VoiceCraft bind request (does not unbind an already-bound voice client)"')
          s = s.replace('"description": "Allow a player to bind/unbind VoiceCraft."', '"description": "Allow a player to bind or cancel a pending VoiceCraft bind request."')
          pattern = re.compile(
              r'        placeholders = \("YOUR-RELAY", "CHANGE_ME"\)\n'
              r'        usable = enabled and url\.startswith\(\("ws://", "wss://"\)\) and server_id and secret\n'
              r'        usable = usable and not any\(marker in url or marker in secret for marker in placeholders\)\n'
              r'        self\._bridge_enabled = usable\n'
              r'        self\._bridge_server_id = server_id or "mcsv-main"\n'
              r'        self\._bridge = \(\n'
              r'            EndstoneRelayClient\(self\.logger, url, self\._bridge_server_id, secret, reconnect_seconds\)\n'
              r'            if usable\n'
              r'            else None\n'
              r'        \)\n'
              r'        if enabled and not usable:\n'
              r'            self\.logger\.warning\(\n'
              r'                "BRIDGE enabled in config but URL/server_id/secret is incomplete; bridge remains disabled"\n'
              r'            \)\n'
          )
          replacement = (
              '        usable, validation_error = self._validate_bridge_config(enabled, url, server_id, secret)\n'
              '        self._bridge_enabled = usable\n'
              '        self._bridge_server_id = server_id or "mcsv-main"\n'
              '        self._bridge = (\n'
              '            EndstoneRelayClient(self.logger, url, self._bridge_server_id, secret, reconnect_seconds)\n'
              '            if usable\n'
              '            else None\n'
              '        )\n'
              '        if enabled and not usable:\n'
              '            self.logger.warning(\n'
              '                f"BRIDGE config invalid: {validation_error}; bridge remains disabled. "\n'
              '                "Use the config generated by VoiceCraft Server Mobile UI4.1."\n'
              '            )\n'
          )
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f"bridge config patch count={n}")
          marker = '    @staticmethod\n    def _bounded_int(value: Any, minimum: int, maximum: int, fallback: int) -> int:\n'
          need(s, marker, "validator marker")
          helper = '''    @staticmethod
    def _validate_bridge_config(enabled: bool, url: str, server_id: str, secret: str) -> tuple[bool, str]:
        if not enabled:
            return False, "bridge is disabled"
        placeholders = ("YOUR-RELAY", "CHANGE_ME", "YOUR_SECRET")
        if any(marker in url or marker in secret for marker in placeholders):
            return False, "placeholder Render URL or Bridge Secret is still configured"
        try:
            parsed = urlparse(url)
        except Exception:
            return False, "relay URL could not be parsed"
        if parsed.scheme not in ("ws", "wss") or not parsed.netloc:
            return False, "relay URL must use ws:// or wss:// and include a hostname"
        if parsed.path != "/bridge":
            return False, "relay URL path must be exactly /bridge"
        if parsed.params or parsed.query or parsed.fragment:
            return False, "relay URL must not include parameters, query text, or a fragment"
        if not server_id:
            return False, "server_id is empty"
        if len(server_id) > 100:
            return False, "server_id is longer than the relay limit of 100 characters"
        if len(secret) < 16:
            return False, "Bridge Secret must be at least 16 characters"
        return True, ""

'''
          s = s.replace(marker, helper + marker, 1)
          s = s.replace('sender.send_error_message("/vcunbind must be run by a player.")', 'sender.send_error_message("/vcunbind must be run by a player. This command only cancels a pending bind request.")')
          s = s.replace('sender.send_message("No pending VoiceCraft binding request was stored.")', 'sender.send_message("No pending VoiceCraft binding request is waiting to be cancelled. An already-bound voice client is not changed by /vcunbind.")')
          s = s.replace('sender.send_message("Pending VoiceCraft binding request cleared.")', 'sender.send_message("Pending VoiceCraft binding request cancelled. This does not unbind an already-bound voice client.")')
          p.write_text(s)

          # bridge.py
          p = Path("VoiceCraft.Endstone/src/endstone_voicecraft/bridge.py")
          s = p.read_text()
          need(s, '"pluginVersion": "0.2.0"', "bridge version")
          s = s.replace('"pluginVersion": "0.2.0"', '"pluginVersion": "0.2.1"', 1)
          need(s, '        self._last_error = ""\n', "bridge state fields")
          s = s.replace('        self._last_error = ""\n', '        self._last_error = ""\n        self._ever_connected = False\n        self._reconnect_attempt = 0\n', 1)
          old = '        while not self._stop.is_set():\n            try:\n                async with aiohttp.ClientSession(timeout=timeout) as session:\n'
          need(s, old, "reconnect loop")
          s = s.replace(old, '        while not self._stop.is_set():\n            try:\n                if self._ever_connected or self._reconnect_attempt:\n                    self._reconnect_attempt += 1\n                    self._logger.info(\n                        f"BRIDGE reconnect attempt={self._reconnect_attempt} "\n                        f"relay={self._safe_endpoint(self._url)} server_id={self._server_id}"\n                    )\n\n                async with aiohttp.ClientSession(timeout=timeout) as session:\n', 1)
          old = '                        self._record_error("")\n                        self._set_state(True, False)\n                        self._logger.info(\n                            f"BRIDGE connected relay={self._safe_endpoint(self._url)} server_id={self._server_id}"\n                        )\n'
          need(s, old, "connected log")
          s = s.replace(old, '                        was_reconnect = self._ever_connected\n                        self._record_error("")\n                        self._set_state(True, False)\n                        self._ever_connected = True\n                        self._reconnect_attempt = 0\n                        self._logger.info(\n                            f"BRIDGE {\'reconnected\' if was_reconnect else \'connected\'} "\n                            f"relay={self._safe_endpoint(self._url)} server_id={self._server_id}"\n                        )\n', 1)
          old = '                        finally:\n                            sender.cancel()\n                            await asyncio.gather(sender, return_exceptions=True)\n'
          need(s, old, "close diagnostics")
          s = s.replace(old, old + '\n                        if not self._stop.is_set():\n                            detail = f"close_code={ws.close_code}"\n                            ws_error = ws.exception()\n                            if ws_error is not None:\n                                detail += f" error={type(ws_error).__name__}: {ws_error}"\n                            raise RuntimeError(f"relay websocket closed ({detail})")\n', 1)
          pattern = re.compile(r'(            except Exception as exc:\n)(                self\._record_error\(f"\{type\(exc\)\.__name__\}: \{exc\}"\)\n                self\._logger\.warning\(\n                    f"BRIDGE disconnected:)')
          repl = '            except Exception as exc:\n                if self._reconnect_attempt == 0:\n                    self._reconnect_attempt = 1\n                self._record_error(f"{type(exc).__name__}: {exc}")\n                self._logger.warning(\n                    f"BRIDGE disconnected:'
          s, n = pattern.subn(repl, s, count=1)
          if n != 1:
              raise SystemExit(f"retry counter patch count={n}")
          p.write_text(s)

          # config comments
          p = Path("VoiceCraft.Endstone/src/endstone_voicecraft/config.toml")
          s = p.read_text()
          old = '# Enable after deploying VoiceCraft.Bridge.Relay to Render.\n'
          need(s, old, "config comment")
          s = s.replace(old, old + '# UI4.1 Copy Plugin Config generates compatible values.\n# URL path must be exactly /bridge; server_id <= 100 chars; secret >= 16 chars.\n', 1)
          p.write_text(s)

          # Endstone README
          p = Path("VoiceCraft.Endstone/README.md")
          s = p.read_text()
          s = s.replace('Target: Endstone API 0.11.x / MCSV Endstone 0.11.10.', 'Target: Endstone API 0.11.x / MCSV Endstone 0.11.10.\n\nVerified companion bundle: **VoiceCraft Server Mobile UI4.1** (`1.7.1-android-phase2-ui4.1`, version code 7) + **Endstone plugin 0.2.1** + Render Relay protocol 1.')
          s = s.replace('- Reconnect automatically and send a full player snapshot when Android reconnects.\n', '- Reconnect automatically and send a full player snapshot when Android reconnects.\n- Validate the relay URL, exact `/bridge` path, Server ID and 16+ character shared secret before opening WSS.\n- Report reconnect attempts and WebSocket close details when available.\n')
          s = s.replace('endstone_voicecraft-0.2.0-py3-none-any.whl', 'endstone_voicecraft-0.2.1-py3-none-any.whl')
          s = s.replace('The Android app must use the exact same `url`, `server_id`, and `secret`.', 'The Android app must use the exact same `url`, `server_id`, and `secret`. Prefer **Copy Plugin Config** in UI4.1 instead of typing them manually.\n\n0.2.1 rejects invalid bridge configuration before connecting: wrong scheme/host, path other than `/bridge`, Server ID empty or over 100 characters, Bridge Secret shorter than 16 characters, query/fragment text, or placeholder values.')
          s = s.replace('- `/vcunbind` clears a pending bind request on the Endstone side.', '- `/vcunbind` **only cancels a pending bind request on the Endstone side**. It does not unbind a VoiceCraft entity that already completed binding.')
          if '## UI4.1 compatibility contract' not in s:
              block = '''## UI4.1 compatibility contract

0.2.1 keeps the existing Phase 2 protocol used by the UI4.1 Android APK. No Android protocol change is required. CI verifies the real Node relay and Endstone WSS client for authentication, peer status, player state, bind/bind-result forwarding, room isolation, invalid-secret rejection, and reconnect after relay restart.

```text
Render BRIDGE_SECRET = Android Bridge Secret = Endstone bridge.secret
Android Server ID    = Endstone bridge.server_id
Android WebSocket    = Endstone bridge.url = wss://<render-service>/bridge
```

'''
              s = s.replace('## Binding flow\n', block + '## Binding flow\n', 1)
          p.write_text(s)

          # Root README
          p = Path("README.md")
          s = p.read_text()
          marker = 'Current Android app version: **`1.7.1-android-phase2-ui4.1`** (version code `7`).\n'
          if 'Current Endstone plugin version:' not in s:
              need(s, marker, "root README marker")
              s = s.replace(marker, marker + 'Current Endstone plugin version: **`0.2.1`**, verified with the UI4.1 release bundle.\n', 1)
          s = s.replace('endstone_voicecraft-0.2.0-py3-none-any.whl', 'endstone_voicecraft-0.2.1-py3-none-any.whl')
          p.write_text(s)

          # Changelog
          p = Path("CHANGELOG.md")
          s = p.read_text()
          intro = 'The project keeps VoiceCraft upstream pinned to **v1.7.1** while evolving the Android host, Endstone integration, Render relay and user interface around it.\n\n'
          if 'Endstone 0.2.1 / UI4.1 compatibility release' not in s:
              need(s, intro, "changelog intro")
              entry = '''## 2026-09-07 — Endstone 0.2.1 / UI4.1 compatibility release

Endstone plugin: `0.2.1`  
Companion Android release: `1.7.1-android-phase2-ui4.1` (version code `7`)

### Fixed / hardened

- Strict bridge validation now matches the Render relay and Android UI4.1 requirements: exact `/bridge`, Server ID limit and 16+ character Bridge Secret.
- `/vcunbind` wording now states that it cancels only a pending request and does not unbind an already-bound entity.
- Reconnect-attempt and WebSocket close diagnostics were added without exposing secrets or binding keys.

### Verification

- Added a real Endstone ↔ Node relay contract test for authentication, peer status, player state, bind/bind-result forwarding, room isolation, invalid-secret rejection and relay-restart reconnection.
- Wheel CI verifies Endstone 0.11.10 annotations, pre-spawn filtering, metadata, entrypoint, bundled config and installed import.
- Protocol remains version 1 and requires no Android UI4.1 protocol change.

---

'''
              s = s.replace(intro, intro + entry, 1)
          p.write_text(s)
          PY

      - name: Commit source and docs only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VoiceCraft.Endstone/src VoiceCraft.Endstone/README.md README.md CHANGELOG.md
          git commit -m "Prepare Endstone 0.2.1 source for UI4.1"
          git push origin HEAD:endstone-0.2.1-ui4.1-release
