name: Prepare Endstone 0.2.1

on:
  push:
    branches: [endstone-0.2.1-ui4.1-release]
    paths:
      - ".github/workflows/prepare-endstone-021.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Endstone 0.2.1 patch automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: endstone-0.2.1-ui4.1-release
          fetch-depth: 0

      - name: Apply Endstone 0.2.1 compatibility update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def need(text: str, old: str, label: str) -> None:
              if old not in text:
                  raise SystemExit(f"missing patch target: {label}")

          plugin = Path("VoiceCraft.Endstone/src/endstone_voicecraft/plugin.py")
          text = plugin.read_text()
          need(text, "import uuid\nfrom typing import Any\n", "urlparse import")
          text = text.replace("import uuid\nfrom typing import Any\n", "import uuid\nfrom typing import Any\nfrom urllib.parse import urlparse\n", 1)
          need(text, 'version = "0.2.0"', "plugin version")
          text = text.replace('version = "0.2.0"', 'version = "0.2.1"', 1)
          text = text.replace('"description": "Clear a pending VoiceCraft bind request"', '"description": "Cancel a pending VoiceCraft bind request (does not unbind an already-bound voice client)"')
          text = text.replace('"description": "Allow a player to bind/unbind VoiceCraft."', '"description": "Allow a player to bind or cancel a pending VoiceCraft bind request."')

          pattern = re.compile(
              r'        placeholders = \("YOUR-RELAY", "CHANGE_ME"\)\n'
              r'        usable = enabled and url\.startswith\(\("ws://", "wss://"\)\) and server_id and secret\n'
              r'        usable = usable and not any\(marker in url or marker in secret for marker in placeholders\)\n'
              r'        self\._bridge_enabled = usable\n'
              r'        self\._bridge_server_id = server_id or "mcsv-main"\n'
              r'        self\._bridge = \(\n'
              r'            EndstoneRelayClient\(self\.logger, url, self\._bridge_server_id, secret, reconnect_seconds\)\n'
              r'            if usable\n'
              r'            else None\n'
              r'        \)\n'
              r'        if enabled and not usable:\n'
              r'            self\.logger\.warning\(\n'
              r'                "BRIDGE enabled in config but URL/server_id/secret is incomplete; bridge remains disabled"\n'
              r'            \)\n'
          )
          replacement = (
              '        usable, validation_error = self._validate_bridge_config(enabled, url, server_id, secret)\n'
              '        self._bridge_enabled = usable\n'
              '        self._bridge_server_id = server_id or "mcsv-main"\n'
              '        self._bridge = (\n'
              '            EndstoneRelayClient(self.logger, url, self._bridge_server_id, secret, reconnect_seconds)\n'
              '            if usable\n'
              '            else None\n'
              '        )\n'
              '        if enabled and not usable:\n'
              '            self.logger.warning(\n'
              '                f"BRIDGE config invalid: {validation_error}; bridge remains disabled. "\n'
              '                "Use the config generated by VoiceCraft Server Mobile UI4.1."\n'
              '            )\n'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"strict bridge config block replacements={count}")

          marker = '    @staticmethod\n    def _bounded_int(value: Any, minimum: int, maximum: int, fallback: int) -> int:\n'
          need(text, marker, "bridge validator insertion")
          helper = (
              '    @staticmethod\n'
              '    def _validate_bridge_config(enabled: bool, url: str, server_id: str, secret: str) -> tuple[bool, str]:\n'
              '        if not enabled:\n'
              '            return False, "bridge is disabled"\n\n'
              '        placeholders = ("YOUR-RELAY", "CHANGE_ME", "YOUR_SECRET")\n'
              '        if any(marker in url or marker in secret for marker in placeholders):\n'
              '            return False, "placeholder Render URL or Bridge Secret is still configured"\n\n'
              '        try:\n'
              '            parsed = urlparse(url)\n'
              '        except Exception:\n'
              '            return False, "relay URL could not be parsed"\n\n'
              '        if parsed.scheme not in ("ws", "wss") or not parsed.netloc:\n'
              '            return False, "relay URL must use ws:// or wss:// and include a hostname"\n'
              '        if parsed.path != "/bridge":\n'
              '            return False, "relay URL path must be exactly /bridge"\n'
              '        if parsed.params or parsed.query or parsed.fragment:\n'
              '            return False, "relay URL must not include parameters, query text, or a fragment"\n'
              '        if not server_id:\n'
              '            return False, "server_id is empty"\n'
              '        if len(server_id) > 100:\n'
              '            return False, "server_id is longer than the relay limit of 100 characters"\n'
              '        if len(secret) < 16:\n'
              '            return False, "Bridge Secret must be at least 16 characters"\n'
              '        return True, ""\n\n'
          )
          text = text.replace(marker, helper + marker, 1)
          text = text.replace('sender.send_error_message("/vcunbind must be run by a player.")', 'sender.send_error_message("/vcunbind must be run by a player. This command only cancels a pending bind request.")')
          text = text.replace('sender.send_message("No pending VoiceCraft binding request was stored.")', 'sender.send_message("No pending VoiceCraft binding request is waiting to be cancelled. An already-bound voice client is not changed by /vcunbind.")')
          text = text.replace('sender.send_message("Pending VoiceCraft binding request cleared.")', 'sender.send_message("Pending VoiceCraft binding request cancelled. This does not unbind an already-bound voice client.")')
          plugin.write_text(text)

          bridge = Path("VoiceCraft.Endstone/src/endstone_voicecraft/bridge.py")
          text = bridge.read_text()
          need(text, '"pluginVersion": "0.2.0"', "bridge hello version")
          text = text.replace('"pluginVersion": "0.2.0"', '"pluginVersion": "0.2.1"', 1)
          need(text, '        self._last_error = ""\n', "reconnect fields")
          text = text.replace('        self._last_error = ""\n', '        self._last_error = ""\n        self._ever_connected = False\n        self._reconnect_attempt = 0\n', 1)

          old = '        while not self._stop.is_set():\n            try:\n                async with aiohttp.ClientSession(timeout=timeout) as session:\n'
          need(text, old, "reconnect attempt log")
          new = (
              '        while not self._stop.is_set():\n'
              '            try:\n'
              '                if self._ever_connected or self._reconnect_attempt:\n'
              '                    self._reconnect_attempt += 1\n'
              '                    self._logger.info(\n'
              '                        f"BRIDGE reconnect attempt={self._reconnect_attempt} "\n'
              '                        f"relay={self._safe_endpoint(self._url)} server_id={self._server_id}"\n'
              '                    )\n\n'
              '                async with aiohttp.ClientSession(timeout=timeout) as session:\n'
          )
          text = text.replace(old, new, 1)

          old = (
              '                        self._record_error("")\n'
              '                        self._set_state(True, False)\n'
              '                        self._logger.info(\n'
              '                            f"BRIDGE connected relay={self._safe_endpoint(self._url)} server_id={self._server_id}"\n'
              '                        )\n'
          )
          need(text, old, "connected log")
          new = (
              '                        was_reconnect = self._ever_connected\n'
              '                        self._record_error("")\n'
              '                        self._set_state(True, False)\n'
              '                        self._ever_connected = True\n'
              '                        self._reconnect_attempt = 0\n'
              '                        self._logger.info(\n'
              '                            f"BRIDGE {\'reconnected\' if was_reconnect else \'connected\'} "\n'
              '                            f"relay={self._safe_endpoint(self._url)} server_id={self._server_id}"\n'
              '                        )\n'
          )
          text = text.replace(old, new, 1)

          old = '                        finally:\n                            sender.cancel()\n                            await asyncio.gather(sender, return_exceptions=True)\n'
          need(text, old, "websocket close diagnostics")
          new = old + (
              '\n                        if not self._stop.is_set():\n'
              '                            detail = f"close_code={ws.close_code}"\n'
              '                            ws_error = ws.exception()\n'
              '                            if ws_error is not None:\n'
              '                                detail += f" error={type(ws_error).__name__}: {ws_error}"\n'
              '                            raise RuntimeError(f"relay websocket closed ({detail})")\n'
          )
          text = text.replace(old, new, 1)

          pattern = re.compile(r'(            except Exception as exc:\n)(                self\._record_error\(f"\{type\(exc\)\.__name__\}: \{exc\}"\)\n                self\._logger\.warning\(\n                    f"BRIDGE disconnected:)')
          replacement = (
              '            except Exception as exc:\n'
              '                if self._reconnect_attempt == 0:\n'
              '                    self._reconnect_attempt = 1\n'
              '                self._record_error(f"{type(exc).__name__}: {exc}")\n'
              '                self._logger.warning(\n'
              '                    f"BRIDGE disconnected:'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"retry counter replacements={count}")
          bridge.write_text(text)

          config = Path("VoiceCraft.Endstone/src/endstone_voicecraft/config.toml")
          text = config.read_text()
          old = '# Enable after deploying VoiceCraft.Bridge.Relay to Render.\n'
          need(text, old, "config comments")
          text = text.replace(old, old + '# UI4.1 Copy Plugin Config generates values that satisfy these requirements.\n# url path must be exactly /bridge; server_id <= 100 chars; secret >= 16 chars.\n', 1)
          config.write_text(text)

          readme = Path("VoiceCraft.Endstone/README.md")
          text = readme.read_text()
          text = text.replace('Target: Endstone API 0.11.x / MCSV Endstone 0.11.10.', 'Target: Endstone API 0.11.x / MCSV Endstone 0.11.10.\n\nVerified companion release: **VoiceCraft Server Mobile UI4.1** (`1.7.1-android-phase2-ui4.1`, Android version code 7) + **Endstone plugin 0.2.1** + Render Relay protocol 1.')
          text = text.replace('- Reconnect automatically and send a full player snapshot when Android reconnects.\n', '- Reconnect automatically and send a full player snapshot when Android reconnects.\n- Validate Render bridge URL, `/bridge` path, Server ID and 16+ character shared secret before opening the WSS client.\n- Improved reconnect logs include reconnect attempts and WebSocket close details when available.\n')
          text = text.replace('endstone_voicecraft-0.2.0-py3-none-any.whl', 'endstone_voicecraft-0.2.1-py3-none-any.whl')
          text = text.replace('The Android app must use the exact same `url`, `server_id`, and `secret`.', 'The Android app must use the exact same `url`, `server_id`, and `secret`. The safest path is to use **Copy Plugin Config** in UI4.1 rather than typing these values manually.\n\nPlugin 0.2.1 rejects bridge configuration before connecting when the URL is not `ws://`/`wss://`, the path is not exactly `/bridge`, the Server ID is empty/over 100 characters, the secret is shorter than 16 characters, or placeholder values are still present.')
          text = text.replace('- `/vcunbind` clears a pending bind request on the Endstone side.', '- `/vcunbind` **only cancels a pending bind request on the Endstone side**. It does not disconnect a VoiceCraft entity that already completed binding; this wording is explicit in 0.2.1 to avoid accidental expectations of a full unbind protocol.')
          compat = ('## UI4.1 compatibility contract\n\nThe 0.2.1 build keeps the existing Phase 2 wire contract used by the UI4.1 Android APK. No new message type is required by the Android side. CI verifies the real Node relay and Endstone WSS client together for authentication, peer status, player state, bind/bind-result forwarding, room isolation, bad-secret rejection, and reconnect after a relay restart.\n\nExpected shared values:\n\n```text\nRender BRIDGE_SECRET = Android Bridge Secret = Endstone bridge.secret\nAndroid Server ID    = Endstone bridge.server_id\nAndroid WebSocket    = Endstone bridge.url = wss://<render-service>/bridge\n```\n\n')
          if '## UI4.1 compatibility contract' not in text:
              text = text.replace('## Binding flow\n', compat + '## Binding flow\n', 1)
          readme.write_text(text)

          root_readme = Path("README.md")
          text = root_readme.read_text()
          marker = 'Current Android app version: **`1.7.1-android-phase2-ui4.1`** (version code `7`).\n'
          if 'Current Endstone plugin version:' not in text:
              need(text, marker, "root README version marker")
              text = text.replace(marker, marker + 'Current Endstone plugin version: **`0.2.1`**, verified with the UI4.1 release bundle.\n', 1)
          text = text.replace('endstone_voicecraft-0.2.0-py3-none-any.whl', 'endstone_voicecraft-0.2.1-py3-none-any.whl')
          root_readme.write_text(text)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          intro = 'The project keeps VoiceCraft upstream pinned to **v1.7.1** while evolving the Android host, Endstone integration, Render relay and user interface around it.\n\n'
          entry = ('## 2026-09-07 — Endstone 0.2.1 / UI4.1 compatibility release\n\nEndstone plugin: `0.2.1`  \nCompanion Android release: `1.7.1-android-phase2-ui4.1` (version code `7`)\n\n### Fixed / hardened\n\n- Added strict bridge validation matching the Render relay and Android app: exact `/bridge` path, Server ID length limit, and Bridge Secret minimum length of 16 characters.\n- Clarified that `/vcunbind` cancels only a pending bind request; it does not unbind an already-bound VoiceCraft entity.\n- Added reconnect-attempt and WebSocket close diagnostics without exposing secrets or binding keys.\n\n### Verification\n\n- Added a real Endstone ↔ Node Render Relay contract test for authentication, peer status, player state, bind/bind-result forwarding, room isolation, invalid-secret rejection, and reconnect after relay restart.\n- Wheel CI still validates Endstone 0.11.10 event annotations, pre-spawn filtering, package metadata, entrypoint, config inclusion and import after installation.\n- The plugin keeps protocol 1 and the existing UI4.1 message contract; no Android protocol change is required.\n\n---\n\n')
          if 'Endstone 0.2.1 / UI4.1 compatibility release' not in text:
              need(text, intro, "CHANGELOG intro")
              text = text.replace(intro, intro + entry, 1)
          changelog.write_text(text)

          workflow = Path('.github/workflows/build-endstone.yml')
          text = workflow.read_text()
          text = text.replace('branches: [main, endstone-phase2]', 'branches: [main, endstone-phase2, endstone-0.2.1-ui4.1-release]')
          if '- "VoiceCraft.Bridge.Relay/**"' not in text:
              text = text.replace('      - "VoiceCraft.Endstone/**"\n', '      - "VoiceCraft.Endstone/**"\n      - "VoiceCraft.Bridge.Relay/**"\n', 1)
          node_marker = '      - name: Install build and Endstone API\n'
          if 'Setup Node 22' not in text:
              node_step = '      - name: Setup Node 22\n        uses: actions/setup-node@v4\n        with:\n          node-version: "22"\n\n'
              text = text.replace(node_marker, node_step + node_marker, 1)
          text = text.replace('run: python -m compileall -q VoiceCraft.Endstone/src', 'run: python -m compileall -q VoiceCraft.Endstone/src VoiceCraft.Endstone/tests')
          text = text.replace('print("Endstone Phase 2 annotations, bridge import, and pre-spawn filter OK")', 'assert VoiceCraftEndstone.version == "0.2.1"\n          ok, reason = VoiceCraftEndstone._validate_bridge_config(True, "wss://voicecraft-server-mobile.onrender.com/bridge", "mcsv-main", "0123456789abcdef0123456789abcdef")\n          assert ok, reason\n          assert not VoiceCraftEndstone._validate_bridge_config(True, "wss://host/", "mcsv-main", "0123456789abcdef")[0]\n          assert not VoiceCraftEndstone._validate_bridge_config(True, "wss://host/bridge", "mcsv-main", "short")[0]\n          assert not VoiceCraftEndstone._validate_bridge_config(True, "wss://host/bridge", "x" * 101, "0123456789abcdef")[0]\n          print("Endstone 0.2.1 annotations, bridge config validation, and pre-spawn filter OK")')
          build_marker = '      - name: Build wheel\n'
          if 'Run real Endstone / Render relay protocol contract' not in text:
              contract_steps = '      - name: Setup Node 22 already completed\n        run: echo "Node ready for relay contract"\n\n      - name: Install Render relay dependencies for contract test\n        working-directory: VoiceCraft.Bridge.Relay\n        run: npm install --omit=dev\n\n      - name: Run real Endstone / Render relay protocol contract\n        env:\n          PYTHONPATH: VoiceCraft.Endstone/src\n        run: python VoiceCraft.Endstone/tests/relay_contract.py\n\n'
              text = text.replace(build_marker, contract_steps + build_marker, 1)
          text = text.replace('assert VoiceCraftEndstone.version == "0.2.0"', 'assert VoiceCraftEndstone.version == "0.2.1"')
          text = text.replace('wheel = glob.glob("dist/*.whl")[0]\n', 'wheel = glob.glob("dist/*.whl")[0]\n          assert "0.2.1" in wheel, wheel\n', 1)
          if 'Version: 0.2.1' not in text:
              text = text.replace('              assert "endstone_voicecraft/bridge.py" in names, names\n', '              assert "endstone_voicecraft/bridge.py" in names, names\n              metadata = [name for name in names if name.endswith(".dist-info/METADATA")]\n              assert metadata, names\n              metadata_text = zf.read(metadata[0]).decode("utf-8")\n              assert "Version: 0.2.1" in metadata_text, metadata_text\n', 1)
          workflow.write_text(text)
          PY

      - name: Remove one-off patch automation
        run: rm -f .github/workflows/prepare-endstone-021.yml

      - name: Commit patched source and docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Endstone 0.2.1 for UI4.1 release"
          git push origin HEAD:endstone-0.2.1-ui4.1-release
