name: Prepare Endstone 0.2.1

on:
  push:
    branches: [endstone-0.2.1-ui4.1-release]
    paths:
      - ".github/workflows/prepare-endstone-021.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Endstone 0.2.1 patch automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: endstone-0.2.1-ui4.1-release
          fetch-depth: 0

      - name: Apply Endstone 0.2.1 compatibility update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing patch target: {label}")
              return text.replace(old, new, 1)

          plugin = Path("VoiceCraft.Endstone/src/endstone_voicecraft/plugin.py")
          text = plugin.read_text()
          text = replace_once(text, "import uuid\nfrom typing import Any\n", "import uuid\nfrom typing import Any\nfrom urllib.parse import urlparse\n", "urlparse import")
          text = replace_once(text, 'version = "0.2.0"', 'version = "0.2.1"', "plugin version")
          text = text.replace('"description": "Clear a pending VoiceCraft bind request"', '"description": "Cancel a pending VoiceCraft bind request (does not unbind an already-bound voice client)"')
          text = text.replace('"description": "Allow a player to bind/unbind VoiceCraft."', '"description": "Allow a player to bind or cancel a pending VoiceCraft bind request."')
          old = '''        placeholders = ("YOUR-RELAY", "CHANGE_ME")
          usable = enabled and url.startswith(("ws://", "wss://")) and server_id and secret
          usable = usable and not any(marker in url or marker in secret for marker in placeholders)
          self._bridge_enabled = usable
          self._bridge_server_id = server_id or "mcsv-main"
          self._bridge = (
              EndstoneRelayClient(self.logger, url, self._bridge_server_id, secret, reconnect_seconds)
              if usable
              else None
          )
          if enabled and not usable:
              self.logger.warning(
                  "BRIDGE enabled in config but URL/server_id/secret is incomplete; bridge remains disabled"
              )
          '''
          new = '''        usable, validation_error = self._validate_bridge_config(enabled, url, server_id, secret)
          self._bridge_enabled = usable
          self._bridge_server_id = server_id or "mcsv-main"
          self._bridge = (
              EndstoneRelayClient(self.logger, url, self._bridge_server_id, secret, reconnect_seconds)
              if usable
              else None
          )
          if enabled and not usable:
              self.logger.warning(
                  f"BRIDGE config invalid: {validation_error}; bridge remains disabled. "
                  "Use the config generated by VoiceCraft Server Mobile UI4.1."
              )
          '''
          text = replace_once(text, old, new, "strict bridge config block")
          marker = '''    @staticmethod
          def _bounded_int(value: Any, minimum: int, maximum: int, fallback: int) -> int:
          '''
          helper = '''    @staticmethod
          def _validate_bridge_config(enabled: bool, url: str, server_id: str, secret: str) -> tuple[bool, str]:
              if not enabled:
                  return False, "bridge is disabled"

              placeholders = ("YOUR-RELAY", "CHANGE_ME", "YOUR_SECRET")
              if any(marker in url or marker in secret for marker in placeholders):
                  return False, "placeholder Render URL or Bridge Secret is still configured"

              try:
                  parsed = urlparse(url)
              except Exception:
                  return False, "relay URL could not be parsed"

              if parsed.scheme not in ("ws", "wss") or not parsed.netloc:
                  return False, "relay URL must use ws:// or wss:// and include a hostname"
              if parsed.path != "/bridge":
                  return False, "relay URL path must be exactly /bridge"
              if parsed.params or parsed.query or parsed.fragment:
                  return False, "relay URL must not include parameters, query text, or a fragment"
              if not server_id:
                  return False, "server_id is empty"
              if len(server_id) > 100:
                  return False, "server_id is longer than the relay limit of 100 characters"
              if len(secret) < 16:
                  return False, "Bridge Secret must be at least 16 characters"
              return True, ""

          ''' + marker
          text = replace_once(text, marker, helper, "bridge validator helper")
          text = text.replace('sender.send_error_message("/vcunbind must be run by a player.")', 'sender.send_error_message("/vcunbind must be run by a player. This command only cancels a pending bind request.")')
          text = text.replace('sender.send_message("No pending VoiceCraft binding request was stored.")', 'sender.send_message("No pending VoiceCraft binding request is waiting to be cancelled. An already-bound voice client is not changed by /vcunbind.")')
          text = text.replace('sender.send_message("Pending VoiceCraft binding request cleared.")', 'sender.send_message("Pending VoiceCraft binding request cancelled. This does not unbind an already-bound voice client.")')
          plugin.write_text(text)

          bridge = Path("VoiceCraft.Endstone/src/endstone_voicecraft/bridge.py")
          text = bridge.read_text()
          text = replace_once(text, '"pluginVersion": "0.2.0"', '"pluginVersion": "0.2.1"', "bridge hello version")
          text = replace_once(text, '        self._last_error = ""\n', '        self._last_error = ""\n        self._ever_connected = False\n        self._reconnect_attempt = 0\n', "reconnect state")
          text = replace_once(text,
              '''        while not self._stop.is_set():
              try:
                  async with aiohttp.ClientSession(timeout=timeout) as session:
              ''',
              '''        while not self._stop.is_set():
              try:
                  if self._ever_connected or self._reconnect_attempt:
                      self._reconnect_attempt += 1
                      self._logger.info(
                          f"BRIDGE reconnect attempt={self._reconnect_attempt} "
                          f"relay={self._safe_endpoint(self._url)} server_id={self._server_id}"
                      )

                  async with aiohttp.ClientSession(timeout=timeout) as session:
              ''',
              "reconnect attempt logging")
          text = replace_once(text,
              '''                        self._record_error("")
              self._set_state(True, False)
              self._logger.info(
                  f"BRIDGE connected relay={self._safe_endpoint(self._url)} server_id={self._server_id}"
              )
              ''',
              '''                        was_reconnect = self._ever_connected
              self._record_error("")
              self._set_state(True, False)
              self._ever_connected = True
              self._reconnect_attempt = 0
              self._logger.info(
                  f"BRIDGE {'reconnected' if was_reconnect else 'connected'} "
                  f"relay={self._safe_endpoint(self._url)} server_id={self._server_id}"
              )
              ''',
              "connected/reconnected logging")
          text = replace_once(text,
              '''                        finally:
              sender.cancel()
              await asyncio.gather(sender, return_exceptions=True)
              except asyncio.CancelledError:
              ''',
              '''                        finally:
              sender.cancel()
              await asyncio.gather(sender, return_exceptions=True)

              if not self._stop.is_set():
                  detail = f"close_code={ws.close_code}"
                  ws_error = ws.exception()
                  if ws_error is not None:
                      detail += f" error={type(ws_error).__name__}: {ws_error}"
                  raise RuntimeError(f"relay websocket closed ({detail})")
              except asyncio.CancelledError:
              ''',
              "websocket close diagnostics")
          text = replace_once(text,
              '''            except Exception as exc:
              self._record_error(f"{type(exc).__name__}: {exc}")
              ''',
              '''            except Exception as exc:
              if self._reconnect_attempt == 0:
                  self._reconnect_attempt = 1
              self._record_error(f"{type(exc).__name__}: {exc}")
              ''',
              "retry counter")
          bridge.write_text(text)

          config = Path("VoiceCraft.Endstone/src/endstone_voicecraft/config.toml")
          text = config.read_text()
          text = replace_once(text,
              '# Enable after deploying VoiceCraft.Bridge.Relay to Render.\n',
              '# Enable after deploying VoiceCraft.Bridge.Relay to Render.\n# UI4.1 Copy Plugin Config generates values that satisfy these requirements.\n# url path must be exactly /bridge; server_id <= 100 chars; secret >= 16 chars.\n',
              "config requirements")
          config.write_text(text)

          readme = Path("VoiceCraft.Endstone/README.md")
          text = readme.read_text()
          text = text.replace('Target: Endstone API 0.11.x / MCSV Endstone 0.11.10.', 'Target: Endstone API 0.11.x / MCSV Endstone 0.11.10.\n\nVerified companion release: **VoiceCraft Server Mobile UI4.1** (`1.7.1-android-phase2-ui4.1`, Android version code 7) + **Endstone plugin 0.2.1** + Render Relay protocol 1.')
          text = text.replace('- Reconnect automatically and send a full player snapshot when Android reconnects.\n', '- Reconnect automatically and send a full player snapshot when Android reconnects.\n- Validate Render bridge URL, `/bridge` path, Server ID and 16+ character shared secret before opening the WSS client.\n- Improved reconnect logs include reconnect attempts and WebSocket close details when available.\n')
          text = text.replace('endstone_voicecraft-0.2.0-py3-none-any.whl', 'endstone_voicecraft-0.2.1-py3-none-any.whl')
          text = text.replace('The Android app must use the exact same `url`, `server_id`, and `secret`.', 'The Android app must use the exact same `url`, `server_id`, and `secret`. The safest path is to use **Copy Plugin Config** in UI4.1 rather than typing these values manually.\n\nPlugin 0.2.1 rejects bridge configuration before connecting when the URL is not `ws://`/`wss://`, the path is not exactly `/bridge`, the Server ID is empty/over 100 characters, the secret is shorter than 16 characters, or placeholder values are still present.')
          text = text.replace('- `/vcunbind` clears a pending bind request on the Endstone side.', '- `/vcunbind` **only cancels a pending bind request on the Endstone side**. It does not disconnect a VoiceCraft entity that already completed binding; this wording is explicit in 0.2.1 to avoid accidental expectations of a full unbind protocol.')
          compat = '''## UI4.1 compatibility contract

          The 0.2.1 build keeps the existing Phase 2 wire contract used by the UI4.1 Android APK. No new message type is required by the Android side. CI verifies the real Node relay and Endstone WSS client together for authentication, peer status, player state, bind/bind-result forwarding, room isolation, bad-secret rejection, and reconnect after a relay restart.

          Expected shared values:

          ```text
          Render BRIDGE_SECRET = Android Bridge Secret = Endstone bridge.secret
          Android Server ID    = Endstone bridge.server_id
          Android WebSocket    = Endstone bridge.url = wss://<render-service>/bridge
          ```

          '''
          text = text.replace('## Binding flow\n', compat + '## Binding flow\n')
          readme.write_text(text)

          root_readme = Path("README.md")
          text = root_readme.read_text()
          marker = 'Current Android app version: **`1.7.1-android-phase2-ui4.1`** (version code `7`).\n'
          if 'Current Endstone plugin version:' not in text:
              text = text.replace(marker, marker + 'Current Endstone plugin version: **`0.2.1`**, verified with the UI4.1 release bundle.\n')
          text = text.replace('endstone_voicecraft-0.2.0-py3-none-any.whl', 'endstone_voicecraft-0.2.1-py3-none-any.whl')
          root_readme.write_text(text)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          intro = 'The project keeps VoiceCraft upstream pinned to **v1.7.1** while evolving the Android host, Endstone integration, Render relay and user interface around it.\n\n'
          entry = '''## 2026-09-07 — Endstone 0.2.1 / UI4.1 compatibility release

          Endstone plugin: `0.2.1`  
          Companion Android release: `1.7.1-android-phase2-ui4.1` (version code `7`)

          ### Fixed / hardened

          - Added strict bridge validation matching the Render relay and Android app: exact `/bridge` path, Server ID length limit, and Bridge Secret minimum length of 16 characters.
          - Clarified that `/vcunbind` cancels only a pending bind request; it does not unbind an already-bound VoiceCraft entity.
          - Added reconnect-attempt and WebSocket close diagnostics without exposing secrets or binding keys.

          ### Verification

          - Added a real Endstone ↔ Node Render Relay contract test for authentication, peer status, player state, bind/bind-result forwarding, room isolation, invalid-secret rejection, and reconnect after relay restart.
          - Wheel CI still validates Endstone 0.11.10 event annotations, pre-spawn filtering, package metadata, entrypoint, config inclusion and import after installation.
          - The plugin keeps protocol 1 and the existing UI4.1 message contract; no Android protocol change is required.

          ---

          '''
          if 'Endstone 0.2.1 / UI4.1 compatibility release' not in text:
              text = text.replace(intro, intro + entry)
          changelog.write_text(text)

          workflow = Path('.github/workflows/build-endstone.yml')
          workflow.write_text('''name: Build Endstone Plugin

          on:
            workflow_dispatch:
            push:
              branches: [main, endstone-phase2, endstone-0.2.1-ui4.1-release]
              paths:
                - "VoiceCraft.Endstone/**"
                - "VoiceCraft.Bridge.Relay/**"
                - ".github/workflows/build-endstone.yml"

          jobs:
            build-wheel:
              runs-on: ubuntu-latest
              timeout-minutes: 15

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4

                - name: Setup Python 3.11
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"

                - name: Setup Node 22
                  uses: actions/setup-node@v4
                  with:
                    node-version: "22"

                - name: Install build and Endstone API
                  run: |
                    python -m pip install --upgrade pip
                    python -m pip install build "endstone==0.11.10" "aiohttp>=3.9"

                - name: Compile plugin source
                  run: python -m compileall -q VoiceCraft.Endstone/src VoiceCraft.Endstone/tests

                - name: Validate Endstone event annotations, spawn filter, and bridge config contract
                  env:
                    PYTHONPATH: VoiceCraft.Endstone/src
                  run: |
                    python - <<'PYTEST'
                    import inspect
                    from endstone.event import PlayerJoinEvent, PlayerQuitEvent
                    from endstone_voicecraft.listener import VoiceCraftListener
                    from endstone_voicecraft.model import PlayerState
                    from endstone_voicecraft.plugin import VoiceCraftEndstone
                    from endstone_voicecraft.bridge import EndstoneRelayClient

                    join_annotation = inspect.signature(VoiceCraftListener.on_player_join).parameters["event"].annotation
                    quit_annotation = inspect.signature(VoiceCraftListener.on_player_quit).parameters["event"].annotation
                    assert join_annotation is PlayerJoinEvent, repr(join_annotation)
                    assert quit_annotation is PlayerQuitEvent, repr(quit_annotation)
                    valid = PlayerState("Test", "1", "u", "Overworld", 0.0, 70.0, 0.0, 5.0, -2.0)
                    sentinel = PlayerState("Test", "1", "u", "Overworld", 0.0, 32768.0, 0.0, 0.0, 0.0)
                    assert VoiceCraftEndstone._valid_state(valid)
                    assert not VoiceCraftEndstone._valid_state(sentinel)
                    assert EndstoneRelayClient is not None
                    assert VoiceCraftEndstone.version == "0.2.1"
                    ok, reason = VoiceCraftEndstone._validate_bridge_config(True, "wss://voicecraft-server-mobile.onrender.com/bridge", "mcsv-main", "0123456789abcdef0123456789abcdef")
                    assert ok, reason
                    assert not VoiceCraftEndstone._validate_bridge_config(True, "wss://host/", "mcsv-main", "0123456789abcdef")[0]
                    assert not VoiceCraftEndstone._validate_bridge_config(True, "wss://host/bridge", "mcsv-main", "short")[0]
                    assert not VoiceCraftEndstone._validate_bridge_config(True, "wss://host/bridge", "x" * 101, "0123456789abcdef")[0]
                    print("Endstone 0.2.1 annotations, bridge config validation, and pre-spawn filter OK")
                    PYTEST

                - name: Install Render relay dependencies for contract test
                  working-directory: VoiceCraft.Bridge.Relay
                  run: npm install --omit=dev

                - name: Run real Endstone / Render relay protocol contract
                  env:
                    PYTHONPATH: VoiceCraft.Endstone/src
                  run: python VoiceCraft.Endstone/tests/relay_contract.py

                - name: Build wheel
                  working-directory: VoiceCraft.Endstone
                  run: python -m build --wheel

                - name: Validate wheel contents, metadata and entrypoint
                  working-directory: VoiceCraft.Endstone
                  shell: bash
                  run: |
                    python - <<'PYTEST'
                    import glob
                    import zipfile
                    wheel = glob.glob("dist/*.whl")[0]
                    assert "0.2.1" in wheel, wheel
                    with zipfile.ZipFile(wheel) as zf:
                        names = set(zf.namelist())
                        assert "endstone_voicecraft/config.toml" in names, names
                        assert "endstone_voicecraft/bridge.py" in names, names
                        assert "endstone_voicecraft/plugin.py" in names, names
                        metadata = [name for name in names if name.endswith(".dist-info/METADATA")]
                        assert metadata, names
                        metadata_text = zf.read(metadata[0]).decode("utf-8")
                        assert "Version: 0.2.1" in metadata_text, metadata_text
                        entry = [name for name in names if name.endswith(".dist-info/entry_points.txt")]
                        assert entry, names
                        entry_text = zf.read(entry[0]).decode("utf-8")
                        assert "voicecraft = endstone_voicecraft:VoiceCraftEndstone" in entry_text, entry_text
                    print(f"Validated {wheel}")
                    PYTEST
                    python -m pip install --no-deps --force-reinstall dist/*.whl
                    python - <<'PYTEST'
                    import inspect
                    from endstone.event import PlayerJoinEvent, PlayerQuitEvent
                    from endstone_voicecraft import VoiceCraftEndstone
                    from endstone_voicecraft.listener import VoiceCraftListener
                    from endstone_voicecraft.bridge import EndstoneRelayClient
                    assert VoiceCraftEndstone.api_version == "0.11"
                    assert VoiceCraftEndstone.version == "0.2.1"
                    assert inspect.signature(VoiceCraftListener.on_player_join).parameters["event"].annotation is PlayerJoinEvent
                    assert inspect.signature(VoiceCraftListener.on_player_quit).parameters["event"].annotation is PlayerQuitEvent
                    assert EndstoneRelayClient is not None
                    print("Endstone 0.2.1 wheel import, metadata, entrypoint and event annotations OK")
                    PYTEST

                - name: Upload Endstone wheel
                  uses: actions/upload-artifact@v4
                  with:
                    name: VoiceCraft-Endstone-Phase2
                    if-no-files-found: error
                    path: VoiceCraft.Endstone/dist/*.whl
          ''')
          PY

      - name: Remove one-off patch automation
        run: rm -f .github/workflows/prepare-endstone-021.yml

      - name: Commit patched source and docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Endstone 0.2.1 for UI4.1 release"
          git push origin HEAD:endstone-0.2.1-ui4.1-release
